<?xml version="1.0" encoding="UTF-8"?>
<!-- IEC 60417-5009 power symbol as centerlines. import_svg ignores stroke-width and
     legends.py thickens each centerline to LEGEND_STROKE_W, so stroke-width
     here is a preview weight only. An open circular arc with its gap centred
     at the top, and a vertical line through the gap down to the circle centre.
     The half-gap of 45 degrees keeps a land of at least LEGEND_STROKE_W
     between the line's band and each arc end at the size SW1 uses. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round">
  <path d="M 78.28 26.72 A 40 40 0 1 1 21.72 26.72"/>
  <path d="M 50 0 L 50 55"/>
</svg>
