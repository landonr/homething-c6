substitutions:
  device_name: homething-c6
  friendly_name: homeThing C6

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_shutdown:
    - switch.turn_off: led_rail
    # Both pins to inputs so R10 holds Q2 off and DIN cannot feed the dead rail
    # through the LED input clamp. Pull GPIO17 down: the RMT driver can leave a
    # pull-up on it, which would sit on DIN.
    - lambda: |-
        gpio_set_direction(GPIO_NUM_17, GPIO_MODE_INPUT);
        gpio_set_pull_mode(GPIO_NUM_17, GPIO_PULLDOWN_ONLY);
        gpio_set_direction(GPIO_NUM_18, GPIO_MODE_INPUT);
        gpio_set_pull_mode(GPIO_NUM_18, GPIO_FLOATING);

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  version: 3

i2c:
  sda: GPIO22
  scl: GPIO23
  frequency: 100kHz
  scan: true

pcf8574:
  - id: button_expander
    address: 0x20
    pcf8575: true

binary_sensor:
  - platform: gpio
    name: Button 1
    pin: &button_1
      pcf8574: button_expander
      number: 0
      mode: INPUT
      inverted: true
  - platform: gpio
    name: Button 2
    pin:
      <<: *button_1
      number: 1
  - platform: gpio
    name: Button 3
    pin:
      <<: *button_1
      number: 2
  - platform: gpio
    name: Button 4
    pin:
      <<: *button_1
      number: 3
  - platform: gpio
    name: Button 5
    pin:
      <<: *button_1
      number: 4
  - platform: gpio
    name: Button 6
    pin:
      <<: *button_1
      number: 5
  - platform: gpio
    name: Button 7
    pin:
      <<: *button_1
      number: 6
  - platform: gpio
    name: Button 8
    pin:
      <<: *button_1
      number: 7
  - platform: gpio
    name: Button 9
    pin:
      <<: *button_1
      number: 8
  - platform: gpio
    name: Button 10
    pin:
      <<: *button_1
      number: 9
  - platform: gpio
    name: Button 11
    pin:
      <<: *button_1
      number: 10
  # ANO wheel on PCF8575 P13..P17. Directions verified on unit 1 2026-07-27 by
  # logging expander edges per press; they match the ENC1 symbol pin names, so
  # the part is mounted as drawn and there is no rotation to compensate for.
  - platform: gpio
    name: Encoder Right
    pin:
      <<: *button_1
      number: 11
  - platform: gpio
    name: Encoder Up
    pin:
      <<: *button_1
      number: 12
  - platform: gpio
    name: Encoder Press
    pin:
      <<: *button_1
      number: 13
  - platform: gpio
    name: Encoder Down
    pin:
      <<: *button_1
      number: 14
  - platform: gpio
    name: Encoder Left
    pin:
      <<: *button_1
      number: 15

  # PCF8575 nINT, R9 100k pull-up on board. ESPHome polls the expander, so this
  # is visibility only: it does not make button reads interrupt-driven. Useful
  # because an edge shows here even when the port bit itself is misrouted.
  - platform: gpio
    name: Expander INT
    id: expander_int
    entity_category: diagnostic
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true

sensor:
  - platform: rotary_encoder
    name: Encoder
    pin_a:
      number: GPIO20
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO19
      mode:
        input: true
        pullup: true
    resolution: 2

  - platform: adc
    name: Battery Voltage
    pin: GPIO4
    attenuation: auto
    update_interval: 5s
    filters:
      - multiply: 2.0
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement

light:
  - platform: esp32_rmt_led_strip
    id: status_light
    name: Status Light
    pin: GPIO17
    chipset: WS2812
    rgb_order: GRB
    num_leds: 4
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - switch.turn_on: led_rail
      # The first frame is written in the same loop tick as this trigger, before
      # led_vdd has risen at D2, so re-send it once the rail is up.
      - delay: 20ms
      # Guarded: a turn-off inside the 20ms window would otherwise be undone.
      - if:
          condition:
            light.is_on: status_light
          then:
            - light.turn_on: status_light
    on_turn_off:
      # Fires one write before the final all-black frame, so let that frame land
      # while the LEDs still have power. GPIO17 then idles low.
      - delay: 100ms
      - if:
          condition:
            light.is_off: status_light
          then:
            - switch.turn_off: led_rail

switch:
  # Q2 is a high-side P-FET on the LED rail: gate low powers led_vdd, so the
  # switch pin is inverted. R10 1M holds the gate at +3.3V, so the rail is off
  # whenever GPIO18 floats (boot, deep sleep).
  - platform: gpio
    name: LED Rail
    id: led_rail
    entity_category: config
    pin:
      number: GPIO18
      inverted: true
    restore_mode: ALWAYS_OFF

remote_receiver:
  pin:
    number: GPIO16
    mode:
      input: true
      pullup: true
    inverted: true
  dump: all
  tolerance: 35%

remote_transmitter:
  pin: GPIO1
  carrier_duty_percent: 50%
  non_blocking: true

# MK1 I2S. GPIO0 is WS and GPIO21 is data in, not the other way round: the two
# swapped at the XIAO when MK1 was rerouted. Getting them backwards drives
# LRCLK onto the mic's SD output and makes two drivers fight.
i2s_audio:
  id: mic_bus
  i2s_bclk_pin: GPIO2
  i2s_lrclk_pin: GPIO0

microphone:
  - platform: i2s_audio
    id: board_microphone
    i2s_audio_id: mic_bus
    i2s_din_pin: GPIO21
    adc_type: external
    pdm: false
    channel: left
    sample_rate: 48000
    bits_per_sample: 32bit
    on_data:
      - lambda: id(mic_bytes) += x.size();

globals:
  - id: mic_bytes
    type: uint32_t
    restore_value: false
    initial_value: "0"

interval:
  - interval: 1s
    then:
      - if:
          condition:
            microphone.is_capturing:
              id: board_microphone
          then:
            - lambda: |-
                ESP_LOGI("microphone", "Captured %u bytes/s", id(mic_bytes));
                id(mic_bytes) = 0;

button:
  - platform: template
    name: Start Microphone Test
    on_press:
      - microphone.capture:
          id: board_microphone

  - platform: template
    name: Stop Microphone Test
    on_press:
      - microphone.stop_capture:
          id: board_microphone

  - platform: template
    name: Send Short IR Test Burst
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 36kHz
          code: [560, -560]
