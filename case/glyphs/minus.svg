<?xml version="1.0" encoding="UTF-8"?>
<!-- Minus sign as plus.svg's horizontal centerline alone, the same length, so SW9
     and SW11 cut a matched pair. import_svg ignores stroke-width and
     legends.py thickens the centerline to LEGEND_STROKE_W, so stroke-width
     here is a preview weight only. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round">
  <path d="M 0 50 L 100 50"/>
</svg>
