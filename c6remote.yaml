substitutions:
  device_name: homething-c6
  friendly_name: homeThing C6

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - ir_learning.h
    - zigbee_learning.h
  on_boot:
    # Ahead of every component, so the Zigbee component can be held down before
    # its own setup runs. A failed component never starts, which is the only way
    # to keep the 802.15.4 stack off: the ESP-Zigbee stack has no stop and no
    # restart, so the switch cannot lift this until the next boot.
    - priority: 800
      then:
        - lambda: |-
            if (!ZigbeeAssignmentManager::radio_enabled_from_flash()) {
              id(zigbee_radio)->mark_failed();
              zigbee_assignments.set_boot_gated(true);
              ESP_LOGI("zigbee_learn", "Zigbee radio is off, so the stack stays down");
            }
    - priority: 600
      then:
        - lambda: ir_code_store.setup();
        - lambda: zigbee_assignments.setup();
        - lambda: id(ble_hid_remote).setup_assignments();
        - script.execute: show_idle_status
  on_shutdown:
    - switch.turn_off: led_rail
    # Both pins to inputs so R10 holds Q2 off and DIN cannot feed the dead rail
    # through the LED input clamp. Pull GPIO17 down: the RMT driver can leave a
    # pull-up on it, which would sit on DIN.
    - lambda: |-
        gpio_set_direction(GPIO_NUM_17, GPIO_MODE_INPUT);
        gpio_set_pull_mode(GPIO_NUM_17, GPIO_PULLDOWN_ONLY);
        gpio_set_direction(GPIO_NUM_18, GPIO_MODE_INPUT);
        gpio_set_pull_mode(GPIO_NUM_18, GPIO_FLOATING);

esp32:
  board: seeed_xiao_esp32c6
  partitions: partitions.csv
  framework:
    type: esp-idf
    sdkconfig_options:
      # A pasted IR code posts up to 512 signed values, and ESPHome rejects a
      # POST body larger than this. The httpd scratch buffer grows on demand and
      # is freed with the request, so idle RAM is unchanged.
      CONFIG_HTTPD_MAX_REQ_HDR_LEN: "8192"

external_components:
  - source:
      type: local
      path: components
  - source: github://luar123/zigbee_esphome@6cb5480cd2499faf9afb825754fa46b084296cb8
    components: [zigbee]

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The Zigbee radio shares the antenna. Coexistence needs modem power save, or
  # the STA misses beacons and the connection flaps.
  power_save_mode: light
  on_connect:
    - script.execute: show_idle_status
  on_disconnect:
    - script.execute: show_idle_status

ble_hid:
  id: ble_hid_remote

zigbee:
  id: zigbee_radio
  name: ${device_name}
  manufacturer: homeThing
  router: false
  sleepy: false
  endpoints:
    - num: 1
      device_type: ON_OFF_SWITCH
      # One client cluster for each action the /buttons page can assign. A
      # cluster the simple descriptor omits still leaves the remote a valid
      # On/Off switch, but Zigbee2MQTT then reports no route for that command.
      clusters:
        - id: ON_OFF
          role: CLIENT
        - id: LEVEL
          role: CLIENT
        - id: COLOR_CONTROL
          role: CLIENT
        - id: SCENES
          role: CLIENT
        - id: WINDOW_COVERING
          role: CLIENT
        - id: THERMOSTAT
          role: CLIENT
        - id: DOOR_LOCK
          role: CLIENT
        - id: IAS_WD
          role: CLIENT
  on_join:
    then:
      - lambda: zigbee_assignments.on_network_up();
      - script.execute: show_idle_status

web_server:
  port: 80
  version: 3

# Serves the button assignment page at /buttons on the same server.
button_config:

i2c:
  sda: GPIO22
  scl: GPIO23
  frequency: 100kHz
  scan: true

pcf8574:
  - id: button_expander
    address: 0x20
    pcf8575: true

binary_sensor:
  # Every input below is assignable. The cycle is IR, Zigbee, voice, then clear.
  # Outside receiver mode the input replays its one active assignment.
  - platform: gpio
    name: Button 1
    pin: &button_1
      pcf8574: button_expander
      number: 0
      mode: INPUT
      inverted: true
    on_press:
      - lambda: ir_ui.tap(20, IrUi::Tap::FULL);
      - if: &send_learned_code
          condition:
            lambda: return ir_ui.take_transmit();
          then:
            - remote_transmitter.transmit_raw:
                carrier_frequency: 38kHz
                code: !lambda return ir_ui.code();
      - if: &start_learned_voice
          condition:
            lambda: return ir_ui.take_voice_start();
          then:
            - lambda: |-
                id(voice_led_state) = 1;
                id(mic_meter_active) = true;
            - light.turn_on:
                id: status_light
                effect: Status Indicators
                brightness: 50%
            # Home Assistant VAD ends the stream, so there is no stop on a timer.
            - voice_assistant.start:
    on_release:
      - script.execute:
          id: release_assignment
          slot: 20
  - platform: gpio
    name: Button 2
    id: button_2
    pin:
      <<: *button_1
      number: 1
    # SW2 carries the receiver-mode gesture as well as its own assignment. A hold
    # of two seconds opens the mode from OFF and closes it from any learn state.
    # A tap runs its assignment. The consumed flag stops a hold release from
    # counting as a tap. A HID assignment uses the physical press edge.
    on_press:
      - lambda: |-
          ir_ui.sw2_consumed = false;
          id(ble_hid_remote).set_pressed(19, true);
      - if:
          condition:
            lambda: return ir_ui.state != IrUi::OFF;
          then:
            - script.execute: exit_receiver_hold
          else:
            - script.execute: detect_receiver_hold
    on_release:
      - script.stop: detect_receiver_hold
      - script.stop: exit_receiver_hold
      - if:
          condition:
            lambda: |-
              return !ir_ui.sw2_consumed &&
                     !id(ble_hid_remote).assignment(19).assigned;
          then:
            - lambda: ir_ui.tap(19, IrUi::Tap::NO_VOICE);
            - if: *send_learned_code
      - lambda: id(ble_hid_remote).set_pressed(19, false);
  - platform: gpio
    name: Button 3
    pin:
      <<: *button_1
      number: 2
    on_press:
      - lambda: ir_ui.tap(3, IrUi::Tap::FULL);
      - if: *send_learned_code
      - if: *start_learned_voice
    on_release:
      - script.execute: {id: release_assignment, slot: 3}
  - platform: gpio
    name: Button 4
    pin:
      <<: *button_1
      number: 3
    on_press:
      - lambda: ir_ui.tap(4, IrUi::Tap::FULL);
      - if: *send_learned_code
      - if: *start_learned_voice
    on_release:
      - script.execute: {id: release_assignment, slot: 4}
  - platform: gpio
    name: Button 5
    pin:
      <<: *button_1
      number: 4
    on_press:
      - lambda: ir_ui.tap(5, IrUi::Tap::FULL);
      - if: *send_learned_code
      - if: *start_learned_voice
    on_release:
      - script.execute: {id: release_assignment, slot: 5}
  - platform: gpio
    name: Button 6
    pin:
      <<: *button_1
      number: 5
    on_press:
      - lambda: ir_ui.tap(6, IrUi::Tap::FULL);
      - if: *send_learned_code
      - if: *start_learned_voice
    on_release:
      - script.execute: {id: release_assignment, slot: 6}
  - platform: gpio
    name: Button 7
    pin:
      <<: *button_1
      number: 6
    on_press:
      - lambda: ir_ui.tap(7, IrUi::Tap::FULL);
      - if: *send_learned_code
      - if: *start_learned_voice
    on_release:
      - script.execute: {id: release_assignment, slot: 7}
  - platform: gpio
    name: Button 8
    pin:
      <<: *button_1
      number: 7
    on_press:
      - lambda: ir_ui.tap(8, IrUi::Tap::FULL);
      - if: *send_learned_code
      - if: *start_learned_voice
    on_release:
      - script.execute: {id: release_assignment, slot: 8}
  - platform: gpio
    name: Button 9
    pin:
      <<: *button_1
      number: 9
    on_press:
      - lambda: ir_ui.tap(9, IrUi::Tap::FULL);
      - if: *send_learned_code
      - if: *start_learned_voice
    on_release:
      - script.execute: {id: release_assignment, slot: 9}
  - platform: gpio
    name: Button 10
    pin:
      <<: *button_1
      number: 8
    on_press:
      - lambda: ir_ui.tap(10, IrUi::Tap::FULL);
      - if: *send_learned_code
      - if: *start_learned_voice
    on_release:
      - script.execute: {id: release_assignment, slot: 10}
  - platform: gpio
    name: Button 11
    pin:
      <<: *button_1
      number: 10
    on_press:
      - lambda: ir_ui.tap(11, IrUi::Tap::FULL);
      - if: *send_learned_code
      - if: *start_learned_voice
    on_release:
      - script.execute: {id: release_assignment, slot: 11}
  # ANO wheel on PCF8575 P13..P17. Directions verified on unit 1 2026-07-27 by
  # logging expander edges per press; they match the ENC1 symbol pin names, so
  # the part is mounted as drawn and there is no rotation to compensate for.
  - platform: gpio
    name: Encoder Right
    pin:
      <<: *button_1
      number: 11
    on_press:
      - lambda: ir_ui.tap(12, IrUi::Tap::FULL);
      - if: *send_learned_code
      - if: *start_learned_voice
    on_release:
      - script.execute: {id: release_assignment, slot: 12}
  - platform: gpio
    name: Encoder Up
    pin:
      <<: *button_1
      number: 12
    on_press:
      - lambda: ir_ui.tap(13, IrUi::Tap::FULL);
      - if: *send_learned_code
      - if: *start_learned_voice
    on_release:
      - script.execute: {id: release_assignment, slot: 13}
  - platform: gpio
    name: Encoder Press
    pin:
      <<: *button_1
      number: 13
    on_press:
      - lambda: ir_ui.tap(14, IrUi::Tap::FULL);
      - if: *send_learned_code
      - if: *start_learned_voice
    on_release:
      - script.execute: {id: release_assignment, slot: 14}
  - platform: gpio
    name: Encoder Down
    pin:
      <<: *button_1
      number: 14
    on_press:
      - lambda: ir_ui.tap(15, IrUi::Tap::FULL);
      - if: *send_learned_code
      - if: *start_learned_voice
    on_release:
      - script.execute: {id: release_assignment, slot: 15}
  - platform: gpio
    name: Encoder Left
    pin:
      <<: *button_1
      number: 15
    on_press:
      - lambda: ir_ui.tap(16, IrUi::Tap::FULL);
      - if: *send_learned_code
      - if: *start_learned_voice
    on_release:
      - script.execute: {id: release_assignment, slot: 16}

  # PCF8575 nINT, R9 100k pull-up on board. ESPHome polls the expander, so this
  # is visibility only: it does not make button reads interrupt-driven. Useful
  # because an edge shows here even when the port bit itself is misrouted.
  - platform: gpio
    name: Expander INT
    id: expander_int
    entity_category: diagnostic
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true

sensor:
  - platform: rotary_encoder
    name: Encoder
    pin_a:
      number: GPIO20
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO19
      mode:
        input: true
        pullup: true
    resolution: 2
    # Wheel rotation takes two more learn slots, so a volume pair can live on the
    # wheel instead of two of SW3..SW11. One detent is one send at resolution 2.
    # A detent has no release edge, so rotation stays out of the assignment cycle:
    # it always arms a capture and never reaches the voice or clear stages.
    on_clockwise:
      - lambda: ir_ui.tap(17, IrUi::Tap::ARM_ONLY);
      - if: *send_learned_code
    on_anticlockwise:
      - lambda: ir_ui.tap(18, IrUi::Tap::ARM_ONLY);
      - if: *send_learned_code

  - platform: adc
    name: Battery Voltage
    pin: GPIO4
    attenuation: auto
    update_interval: 5s
    filters:
      - multiply: 2.0
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement

light:
  - platform: esp32_rmt_led_strip
    id: status_light
    name: Status Light
    pin: GPIO17
    chipset: WS2812
    rgb_order: GRB
    num_leds: 4
    # The C6 has two RMT TX channels of 48 symbols. Without this the strip takes
    # the 96-symbol default, remote_transmitter gets no channel and is marked
    # failed at boot, and every IR send returns silently.
    rmt_symbols: 48
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_lambda:
          name: Status Indicators
          update_interval: 50ms
          lambda: |-
            if (initial_run) {
              id(mic_level) = 0.0f;
            }
            it.all() = Color::BLACK;

            // D2 pulses red offline and orange on Wi-Fi alone, then holds green
            // on the API. Wi-Fi only serves the /buttons page, so a dark D2 does
            // not stop a button: playback is Zigbee groupcast or IR.
            const bool wifi_connected = wifi::global_wifi_component->is_connected();
            const bool api_connected = api::global_api_server->is_connected();
            if (!api_connected) {
              const float phase = (millis() % 2400) / 2400.0f;
              // Input 98 produces 3/255 after 50% brightness and gamma correction.
              const uint8_t level = 98 + static_cast<uint8_t>(
                  64.0f * (0.5f - 0.5f * cosf(2.0f * static_cast<float>(M_PI) * phase)));
              it[0] = wifi_connected ? Color(level, level / 4, 0) : Color(level, 0, 0);
            } else {
              it[0] = Color(0, 96, 24);
            }

            // D3 and D4 show assignment mode when it is open, otherwise
            // voice-assistant state. Assignment mode never writes D2 or D5, so a
            // Wi-Fi or Zigbee fault stays visible while an input is trained.
            if (ir_ui.state != IrUi::OFF) {
              if (ir_ui.state == IrUi::READING) {
                // Two LEDs at 300 ms keep the former four-LED 600 ms chase.
                it[1 + ((millis() / 300) % 2)] = Color(0, 0, 200);
              } else {
                const float mode_phase = (millis() % 1200) / 1200.0f;
                const uint8_t mode_level = 40 + static_cast<uint8_t>(
                    160.0f * (0.5f - 0.5f * cosf(2.0f * static_cast<float>(M_PI) * mode_phase)));
                Color mode = Color::BLACK;
                if (ir_ui.state == IrUi::READY) {
                  mode = Color(0, 0, 160);
                } else if (ir_ui.state == IrUi::SAVED) {
                  mode = Color(0, 180, 0);
                } else if (ir_ui.state == IrUi::ERROR && ((millis() / 150) % 2) == 0) {
                  mode = Color(200, 0, 0);
                } else if (ir_ui.state == IrUi::VOICE) {
                  mode = Color(0, 0, mode_level);
                } else if (ir_ui.state == IrUi::CLEARED) {
                  mode = Color(160, 60, 0);
                }
                it[1] = mode;
                it[2] = mode;
              }
            } else if (id(voice_led_state) == 1) {
              it[1] = Color(192, 48, 0);
              it[2] = Color(192, 48, 0);
            } else if (id(voice_led_state) == 2) {
              it[1] = Color(0, 48, 255);
              it[2] = Color(0, 48, 255);
            } else if (id(voice_led_state) == 3) {
              it[1] = Color(96, 0, 96);
              it[2] = Color(96, 0, 96);
            } else if (id(voice_led_state) == 4) {
              it[1] = Color(255, 0, 0);
              it[2] = Color(255, 0, 0);
            }

            // D5 is Zigbee status during normal operation. A radio switched off
            // sends nothing, so it reads the same as a stack that never started.
            if (!zigbee_assignments.radio_enabled() || !id(zigbee_radio).is_started()) {
              it[3] = Color::BLACK;
            } else if (id(zigbee_radio).is_connected()) {
              it[3] = Color(0, 128, 0);
            } else {
              const float phase = (millis() % 1600) / 1600.0f;
              const uint8_t level = 48 + static_cast<uint8_t>(
                  144.0f * (0.5f - 0.5f * cosf(2.0f * static_cast<float>(M_PI) * phase)));
              it[3] = Color(level, 0, 0);
            }
    on_turn_on:
      - switch.turn_on: led_rail
      # The first frame is written in the same loop tick as this trigger, before
      # led_vdd has risen at D2, so re-send it once the rail is up.
      - delay: 20ms
      # Guarded: a turn-off inside the 20ms window would otherwise be undone.
      - if:
          condition:
            light.is_on: status_light
          then:
            - light.turn_on: status_light
    on_turn_off:
      # Fires one write before the final all-black frame, so let that frame land
      # while the LEDs still have power. GPIO17 then idles low.
      - delay: 100ms
      - if:
          condition:
            light.is_off: status_light
          then:
            - switch.turn_off: led_rail

switch:
  # Bench diagnostic for the missing 100k pull-down on sd (see ROADMAP). DS-000069
  # page 12 wants one so MK1's tristated SD output cannot float; the board has
  # none. Toggle this while the mic test runs and watch whether the reported peak
  # moves. i2s_audio offers no pull setting for the data pin, so this reaches
  # past it to the GPIO. Delete once the question is settled either way.
  - platform: template
    name: Mic SD Pulldown
    id: sd_pulldown
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: gpio_set_pull_mode(GPIO_NUM_21, GPIO_PULLDOWN_ONLY);
    turn_off_action:
      - lambda: gpio_set_pull_mode(GPIO_NUM_21, GPIO_FLOATING);

  # Q2 is a high-side P-FET on the LED rail: gate low powers led_vdd, so the
  # switch pin is inverted. R10 1M holds the gate at +3.3V, so the rail is off
  # whenever GPIO18 floats (boot, deep sleep).
  - platform: gpio
    name: LED Rail
    id: led_rail
    entity_category: config
    pin:
      number: GPIO18
      inverted: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      # Interlock. Turning this switch off by hand while the light is on leaves
      # the RMT writing frames into a dead rail, so blank the light first. The
      # light's own on_turn_off then calls switch.turn_off again, which re-fires
      # this trigger once and stops on the guard.
      - if:
          condition:
            light.is_on: status_light
          then:
            - light.turn_off: status_light

  # Q3 is a high-side P-FET on the IR receiver rail: gate low powers ir_vdd, so
  # the switch pin is inverted. R11 1M holds the gate at +3.3V, so the rail is
  # off whenever GPIO6 floats. This one defaults ON, unlike the LED rail, because
  # remote_receiver cannot decode with U2 unpowered. Turning it off while awake
  # leaks: GPIO16's pullup feeds U2's internal 30k to a dead Vs, roughly 44uA,
  # which partially powers the rail. Deep sleep releases the pullup, so the 350uA
  # is only reclaimable there.
  - platform: gpio
    name: IR Rail
    id: ir_rail
    entity_category: config
    pin:
      number: GPIO6
      inverted: true
    restore_mode: ALWAYS_ON

  # Both radio switches keep their state in the assignment record of the radio
  # they gate, so the remote restores them itself and needs no restore_mode. The
  # /buttons page writes the same two flags.
  - platform: template
    name: Zigbee Radio
    id: zigbee_radio_enable
    entity_category: config
    # DISABLED, because the manager owns the state. The template default,
    # ALWAYS_OFF, fires turn_off_action at every boot and would switch the radio
    # off before on_boot has read the stored flag.
    restore_mode: DISABLED
    lambda: return zigbee_assignments.radio_enabled();
    turn_on_action:
      - lambda: zigbee_assignments.set_radio_enabled(true);
    turn_off_action:
      - lambda: zigbee_assignments.set_radio_enabled(false);

  # Off skips the NimBLE bring-up at boot, so the first turn-on starts the stack.
  - platform: template
    name: Bluetooth Radio
    id: ble_radio_enable
    entity_category: config
    restore_mode: DISABLED
    lambda: return id(ble_hid_remote).radio_enabled();
    turn_on_action:
      - lambda: id(ble_hid_remote).set_radio_enabled(true);
    turn_off_action:
      - lambda: id(ble_hid_remote).set_radio_enabled(false);

remote_receiver:
  pin:
    number: GPIO16
    mode:
      input: true
      pullup: true
    inverted: true
  dump: all
  tolerance: 35%
  on_raw:
    - lambda: |-
        ir_code_store.log_received(x);
        ir_ui.captured(x);

remote_transmitter:
  pin: GPIO1
  carrier_duty_percent: 50%
  non_blocking: true
  # Share ESP32-C6 TX RMT memory with the status LED strip.
  rmt_symbols: 48

# MK1 I2S. GPIO0 is WS and GPIO21 is data in, not the other way round: the two
# swapped at the XIAO when MK1 was rerouted. Getting them backwards drives
# LRCLK onto the mic's SD output and makes two drivers fight.
i2s_audio:
  id: mic_bus
  i2s_bclk_pin: GPIO2
  i2s_lrclk_pin: GPIO0

microphone:
  - platform: i2s_audio
    id: board_microphone
    i2s_audio_id: mic_bus
    i2s_din_pin: GPIO21
    adc_type: external
    pdm: false
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit
    on_data:
      - lambda: |-
          id(mic_bytes) += x.size();
          const int32_t *samples = reinterpret_cast<const int32_t *>(x.data());
          const size_t count = x.size() / sizeof(int32_t);
          uint16_t peak = 0;
          for (size_t i = 0; i < count; i++) {
            const int32_t sample = samples[i] >> 16;
            const uint16_t magnitude = sample < 0 ? -sample : sample;
            if (magnitude > peak)
              peak = magnitude;
          }
          if (peak > id(mic_peak))
            id(mic_peak) = peak;
          const float level = std::min(1.0f, std::max(0.0f,
              (static_cast<float>(peak) - 24.0f) / (512.0f - 24.0f)));
          id(mic_level) = std::max(level, id(mic_level) * 0.82f);

script:
  - id: release_assignment
    mode: parallel
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: return ir_ui.release(static_cast<uint8_t>(slot));
          then:
            - voice_assistant.stop:
  - id: detect_receiver_hold
    mode: restart
    then:
      - delay: 2s
      - lambda: |-
          if (ir_ui.state != IrUi::OFF)
            return;
          ir_ui.open();
          ir_ui.sw2_consumed = true;
          id(ir_rail).turn_on();
          id(status_light).turn_on().set_brightness(0.5f).set_effect("Status Indicators").perform();
  - id: exit_receiver_hold
    mode: restart
    then:
      - delay: 2s
      - lambda: |-
          if (ir_ui.state == IrUi::OFF)
            return;
          ir_ui.close();
          ir_ui.sw2_consumed = true;
  - id: show_idle_status
    then:
      - if:
          condition:
            lambda: return !id(mic_meter_active);
          then:
            - lambda: |-
                id(voice_led_state) = 0;
                ESP_LOGD("main", "VA LED: 0 (idle)");
            - light.turn_on:
                id: status_light
                effect: Status Indicators
                brightness: 50%
  - id: stop_voice_listening
    then:
      - lambda: id(mic_meter_active) = false;
      - script.execute: show_idle_status

voice_assistant:
  # gain_factor is applied in the Q31 domain before the 32-to-16 bit truncation,
  # so it recovers the mic's low bits rather than amplifying quantization noise.
  # The ICS-43434 is -26 dBFS at 94 dB SPL, which puts speech near -54 dBFS raw.
  microphone:
    - microphone: board_microphone
      gain_factor: 32
  # noise_suppression_level, auto_gain and volume_multiplier are applied by HA's
  # server-side enhancer, not on the device. Left at defaults: with them set to
  # 2 / 31dBFS / 2.0 HA aborted the stream 7.6s in with stt-stream-failed.
  # gain_factor above is device-side and unaffected.
  on_start:
    - logger.log: "VA: pipeline start requested"
  on_listening:
    # The LEDs are the cue to start talking, so they light here rather than on
    # the button press: HA's reply can lag the request by seconds, and audio
    # captured before streaming opens is discarded.
    - logger.log: "VA: listening"
    - lambda: |-
        id(voice_led_state) = 2;
        ESP_LOGD("main", "VA LED: 2 (listening)");
    - light.turn_on:
        id: status_light
        effect: Status Indicators
        brightness: 50%
  on_stt_vad_start:
    - logger.log: "VA: speech detected"
  on_stt_vad_end:
    - logger.log: "VA: speech ended"
    - lambda: id(mic_meter_active) = false;
    - lambda: |-
        id(voice_led_state) = 3;
        ESP_LOGD("main", "VA LED: 3 (speech ended)");
    - light.turn_on:
        id: status_light
        effect: Status Indicators
        brightness: 50%
  on_stt_end:
    - lambda: |-
        ESP_LOGI("voice_assistant", "STT result: '%s'", x.c_str());
  on_end:
    - script.execute: stop_voice_listening
  on_error:
    - lambda: |-
        ESP_LOGE("voice_assistant", "Error %s / %s", code.c_str(), message.c_str());
    - lambda: id(mic_meter_active) = false;
    - lambda: |-
        id(voice_led_state) = 4;
        ESP_LOGD("main", "VA LED: 4 (voice-assistant error)");
    - light.turn_on:
        id: status_light
        effect: Status Indicators
        brightness: 50%
    - delay: 2s
    - script.execute: stop_voice_listening
  on_client_disconnected:
    - script.execute: stop_voice_listening

globals:
  - id: mic_bytes
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: mic_level
    type: float
    restore_value: false
    initial_value: "0.0f"
  - id: mic_peak
    type: uint16_t
    restore_value: false
    initial_value: "0"
  - id: mic_meter_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: voice_led_state
    type: uint8_t
    restore_value: false
    initial_value: "0"

interval:
  - interval: 250ms
    then:
      - lambda: |-
          if (ir_ui.take_open_request()) {
            id(ir_rail).turn_on();
            id(status_light).turn_on().set_brightness(0.5f).set_effect("Status Indicators").perform();
          }
          if (ir_ui.tick())
            id(show_idle_status).execute();
          zigbee_assignments.tick();
          // The Zigbee component exports no global instance, so the link state
          // is pushed from here, where the id is in scope.
          zigbee_assignments.set_link_state(id(zigbee_radio).is_started(),
                                            id(zigbee_radio).is_connected(),
                                            id(zigbee_radio)->factory_new_.load());
  - interval: 1s
    then:
      - if:
          condition:
            microphone.is_capturing:
              id: board_microphone
          then:
            - lambda: |-
                ESP_LOGI("microphone", "Captured %u bytes/s, level %.3f, peak %u",
                         static_cast<unsigned>(id(mic_bytes)), id(mic_level),
                         static_cast<unsigned>(id(mic_peak)));
                id(mic_bytes) = 0;
                id(mic_peak) = 0;

button:
  # The Zigbee stack starts only at boot, so turning its switch back on needs
  # this. Nothing else on the device offers a restart.
  - platform: restart
    name: Restart

  - platform: template
    name: Stop Microphone Test
    on_press:
      - microphone.stop_capture:
          id: board_microphone
      - script.execute: stop_voice_listening
