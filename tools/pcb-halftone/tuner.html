<section id="c6-halftone-tuner" aria-label="PCB halftone tuner">
  <style>
    #c6-halftone-tuner { display:grid; gap:1rem; max-width:720px; }
    #c6-halftone-tuner .sliders { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.75rem; }
    #c6-halftone-tuner .settings-section { grid-column:1 / -1; min-inline-size:0; }
    #c6-halftone-tuner .settings-section > .sliders { margin-block-start:.65rem; }
    #c6-halftone-tuner .settings-section summary { padding-block:.2rem; }
    #c6-halftone-tuner [data-panel][hidden] { display:none; }
    #c6-halftone-tuner .slider-label { display:flex; gap:.4rem; justify-content:space-between; align-items:baseline; }
    #c6-halftone-tuner .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:.65rem; }
    #c6-halftone-tuner .toolbar label { display:flex; align-items:center; gap:.5rem; }
    #c6-halftone-tuner .boards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1rem; max-width:340px; }
    #c6-halftone-tuner .boards[data-view="detail"] { max-width:560px; }
    #c6-halftone-tuner figure { margin:0; min-width:0; display:grid; gap:.35rem; }
    #c6-halftone-tuner canvas { display:block; width:100%; aspect-ratio:36.9824 / 129.9972; }
    #c6-halftone-tuner .boards[data-view="detail"] canvas { aspect-ratio:36.9824 / 34; }
    @media (max-width:460px) { #c6-halftone-tuner .sliders { grid-template-columns:1fr; gap:.3rem; } }
  </style>

      };

    function applySettings(settings) {
      for (const input of controls) {
        const side = input.closest("[data-panel]").dataset.panel;
        const values = settings[side];
        const key = input.dataset.setting;
        const value = values?.[key] ?? settingsDefaults(values)[key];
        if (typeof value === "number" && Number.isFinite(value)) input.value = value;
      }
    }

    function applyState(state) {
      const saved = state?.modelContent;
      if (saved?.type !== "c6-halftone") return;
      const ui = state.privateContent;
      const updated = saved.labelCoverage === "all";
      if (updated) applySettings({front: saved, back: saved.back});
      if (["full", "detail"].includes(ui?.view)) view.value = ui.view;
      if (["front", "back"].includes(ui?.side)) sideControl.value = ui.side;
      if (Array.isArray(ui?.customPresets)) {
        presets = [initialPreset, ...ui.customPresets.slice(0, presetLimit - 1)];
      }
      updatePresetMenu(updated ? ui?.presetSelection : latestPresetKey);
    }

    async function loadSettingsFile() {
      try {
        const response = await fetch("settings.json", {cache: "no-store"});
        if (!response.ok) return;
        const snapshot = await response.json();
        const isObject = value => value !== null && typeof value === "object";
        if (snapshot?.type !== "c6-halftone" || !isObject(snapshot.front) || !isObject(snapshot.back)) return;
        applySettings({front: snapshot.front, back: snapshot.back});
        const presetNumber = name => Number(/^Preset (\d+)$/.exec(name)?.[1]);
        const custom = Object.entries(isObject(snapshot.presets) ? snapshot.presets : {})
          .map(([name, preset]) => [presetNumber(name), preset])
          .filter(([number, preset]) => number > 0 && isObject(preset?.front) && isObject(preset?.back))
          .sort(([a], [b]) => a - b)
          .slice(0, presetLimit);
        if (custom.length) presets = custom.map(([, preset]) => ({front: preset.front, back: preset.back}));
        const selected = presetNumber(snapshot.presetSelection);
        const index = custom.length ? custom.findIndex(([number]) => number === selected) : selected - 1;
        const builtIn = [...presetControl.options].find(option =>
          option.value in builtInPresets && option.text === snapshot.presetSelection);
        updatePresetMenu(index >= 0 ? String(index) : builtIn?.value ?? latestPresetKey);
        schedule();
      } catch {}
    }

    function saveState() {
      if (!window.openai?.setWidgetState) return;
      window.openai.setWidgetState({
        modelContent: {type: "c6-halftone", shape: "circle", labelCoverage: "all", ...readSettings("front"), back: readSettings("back")},
        privateContent: {
          view: view.value,
          side: sideControl.value,
          presetSelection: presetControl.value,
          customPresets: presets.slice(1)
        }
      }).catch(() => {});
    }

    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }

    function orderedDensityRank(x, y) {
      const row = Math.round((y - .85) / .76);
      const col = Math.round((x - .78) / .78 - (row % 2) * .5);
      // The staggered dot lattice repeats this ordered 8 × 8 fill pattern.
      let rank = 0;
      for (let bit = 0; bit < 3; bit++) {
        rank = 4 * rank + 2 * (((col ^ row) >> bit) & 1) + ((row >> bit) & 1);
      }
      return (rank + .5) / 64;
    }

    function lattice(x, y) {
      let value = Math.imul(x + 17, 73856093) ^ Math.imul(y + 31, 19349663);
      value = Math.imul(value ^ (value >>> 16), 0x45d9f3b);
      value = Math.imul(value ^ (value >>> 16), 0x45d9f3b);
      return ((value ^ (value >>> 16)) >>> 0) / 0xffffffff;
    }

    function valueNoise(x, y) {
      const i = Math.floor(x);
      const j = Math.floor(y);
      const u = smoothstep(x - i);
      const v = smoothstep(y - j);
      const top = lattice(i, j) * (1 - u) + lattice(i + 1, j) * u;
      const bottom = lattice(i, j + 1) * (1 - u) + lattice(i + 1, j + 1) * u;
      return top * (1 - v) + bottom * v;
    }

    function cloudShadow(x, y, scale, contrastPower) {
      const u = x / scale;
      const v = y / scale;
      const cloud = .78 * valueNoise(u, v) + .22 * valueNoise(u * 2 + 8, v * 2 - 5);
      const shade = smoothstep(Math.max(0, Math.min(1, (cloud - .34) / .40)));
      if (contrastPower === 1) return shade;
      const dark = shade ** contrastPower;
      const light = (1 - shade) ** contrastPower;
      return dark / (dark + light);
    }

    function radiiFor(preview, settings) {
      const density = settings.minDensity / 100;
      const highlight = settings.highlights / 100;
      const shadow = settings.shadows / 100;
      const largeShadow = settings.cloudAmount / 100;
      const smallShadow = (settings.smallCloudAmount ?? settings.cloudAmount) / 100;
      const smallShadowSize = settings.smallCloudSize ?? settings.cloudSize;
      const largeShadowContrast = 2 ** (((settings.cloudContrast ?? 50) - 50) / 25);
      const smallShadowContrast = 2 ** (((settings.smallCloudContrast ?? 50) - 50) / 25);
      const largeShadowX = settings.cloudX ?? 0;
      const largeShadowY = preview.cloudOffset - (settings.cloudY ?? 0);
      const smallShadowX = settings.smallCloudX ?? 0;
      const smallShadowY = preview.cloudOffset - (settings.smallCloudY ?? 0);
      const contrast = settings.contrast / 50;
      const brightnessOffset = ((settings.brightness ?? 50) - 50) * .002;
      const maxRadius = settings.maxDiameter / 200;
      const largeWidth = (settings.largeWidth ?? 100) / 100;
      const smallHighlight = .5 + highlight;
      const radii = preview.dots.map(([x, y, cap, distance, small, wordmarkClearance]) => {
        const crest = Math.max(0, 1 - distance / largeWidth) ** .88;
        const largeBand = .33 * crest * highlight;
        const smallBand = .26 * small * shadow * smallHighlight;
        const band = largeBand + smallBand;
        const largeCloud = largeShadow * cloudShadow(x - largeShadowX, y + largeShadowY, settings.cloudSize, largeShadowContrast);
        const smallCloud = smallShadow * cloudShadow(x - smallShadowX, y + smallShadowY, smallShadowSize, smallShadowContrast);
        const shadowCoverage = band > 0
          ? (largeBand * largeCloud + smallBand * smallCloud) / band
          : 0;
        const deepShadow = Math.min(1, Math.max(0, (shadowCoverage - .72) / .28));
        const rippleDensity = band > 0 ? 1 - smoothstep(deepShadow) : 0;
        const rank = orderedDensityRank(x, y);
        if (rank >= Math.max(rippleDensity, density)) return 0;
        const tone = .095 + largeBand * (1 - largeCloud) + smallBand * (1 - smallCloud);
        // The density floor adds minimum-size dots after the shadows.
        const radius = rank < rippleDensity
          ? Math.max(.095, .16 + (tone - .16) * contrast + brightnessOffset)
          : .095;
        let clearance = Math.min(cap, labelDistance(x, y, preview.labelBoxes) - settings.margin / 100);
        let visibleRadius = radius;
        if (wordmarkClearance !== undefined) {
          clearance = Math.min(clearance, wordmarkClearance);
          const fade = smoothstep(Math.max(0, Math.min(1, (wordmarkClearance - .095) / 2.0)));
          if (orderedDensityRank(x + 3.12, y + 1.52) >= fade) return 0;
          visibleRadius = .095 + (radius - .095) * fade;
        }
        return clearance >= .095 ? Math.min(visibleRadius, clearance) : 0;
      });
      const limited = radii.filter(radius => radius > maxRadius).length;
      return {radii, limited};
    }

    function labelDistance(x, y, boxes) {
      return Math.min(...boxes.map(([bx, by, w, h]) =>
        Math.hypot(Math.max(0, bx - x, x - bx - w), Math.max(0, by - y, y - by - h))));
    }

    function paintDot(context, x, y, radius) {
      context.moveTo(x + radius, y);
      context.arc(x, y, radius, 0, 2 * Math.PI);
      context.closePath();
    }

    function draw(preview, radii, maxDiameter) {
      const maxRadius = maxDiameter / 200;
      const {canvas, image, dots} = preview;
      const w = Math.max(1, Math.round(canvas.clientWidth * (window.devicePixelRatio || 1)));
      const cropHeight = view.value === "detail" ? 34 : height;
      const y0 = view.value === "detail" ? preview.detailY : 0;
      const h = Math.round(w * cropHeight / width);
      if (canvas.width !== w) canvas.width = w;
      if (canvas.height !== h) canvas.height = h;
      const context = canvas.getContext("2d");
      context.setTransform(w / width, 0, 0, h / cropHeight, 0, -y0 * h / cropHeight);
      context.clearRect(0, y0, width, cropHeight);
      if (image.complete && image.naturalWidth > 0) context.drawImage(image, 0, 0, width, height);
      context.fillStyle = boardInk;
      context.beginPath();
      for (let i = 0; i < dots.length; i++) {
        const [x, y] = dots[i];
        const r = radii[i];
        if (!r || y + r < y0 || y - r > y0 + cropHeight) continue;
        paintDot(context, x, y, Math.min(Math.floor(r * 1e6 - 1) / 1e6, maxRadius));
      }
      context.fill();
    }

    function render() {
      for (const panel of root.querySelectorAll("[data-panel]")) panel.hidden = panel.dataset.panel !== sideControl.value;
      boards.dataset.view = view.value;
      for (const input of controls) {
        input.parentElement.querySelector("output").value = ["maxDiameter", "margin"].includes(input.dataset.setting)
          ? (Number(input.value) / 100).toFixed(2) + " mm"
          : input.value + (input.dataset.unit ?? "%");
      }
      let limited = 0;
      for (const preview of previews) {
        const settings = readSettings(preview.side);
        const result = radiiFor(preview, settings);
        if (preview.side === sideControl.value) limited = result.limited;
        draw(preview, result.radii, settings.maxDiameter);
      }
      const next = limited ? limited.toLocaleString() + " dots limited by clearance" : "0.10 mm minimum dot gap";
      if (status.textContent !== next) status.textContent = next;
    }

    previews = Object.entries(data).map(([side, item]) => prepare(side, item));
    applySettings(latestPreset);
    updatePresetMenu(latestPresetKey);
    applyState(window.openai?.widgetState);
    if (!window.openai?.widgetState) loadSettingsFile();
    for (const input of controls) {
      input.addEventListener("input", schedule);
      input.addEventListener("change", saveState);
    }
    savePresetButton.addEventListener("click", () => {
      presets.push(currentSettings());
      updatePresetMenu(String(presets.length - 1));
      presetStatus.textContent = "Saved " + presetControl.selectedOptions[0].text;
      saveState();
    });
    root.querySelector("[data-reset-preset]").addEventListener("click", () => {
      applySettings(selectedPreset(presetControl.value));
      presetStatus.textContent = "Restored " + presetControl.selectedOptions[0].text;
      schedule();
      saveState();
    });
    root.querySelector("[data-export-settings]").addEventListener("click", async () => {
      const json = JSON.stringify(exportSnapshot());
      if (window.openai?.sendFollowUpMessage) {
        try {
          await window.openai.sendFollowUpMessage({
            title: "Copy and stash tuner settings",
            prompt: "Copy this PCB halftone settings snapshot to the macOS clipboard using pbcopy. Create a new Git stash containing only tools/pcb-halftone/settings.json with this snapshot, including all presets.\n\n" + json
          });
          return;
        } catch {}
      }
      const fallback = root.querySelector("[data-export-fallback]");
      const output = fallback.querySelector("textarea");
      fallback.hidden = false;
      output.value = json;
      output.focus();
      output.select();
    });
    presetControl.addEventListener("change", () => {
      presetStatus.textContent = "";
      saveState();
    });
    sideControl.addEventListener("change", () => { schedule(); saveState(); });
    view.addEventListener("change", () => { schedule(); saveState(); });
    window.addEventListener("openai:set_globals", event => {
      applyState(event.detail?.globals?.widgetState);
      schedule();
    });
    new ResizeObserver(schedule).observe(boards);
    render();
  })();
  </script>
