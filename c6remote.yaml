substitutions:
  device_name: homething-c6
  friendly_name: homeThing C6

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Appends the last six MAC hex digits, so each remote gets its own hostname
  # and Home Assistant name.
  name_add_mac_suffix: true
  includes:
    - ir_name.h
    - ir_learning.h
    - zigbee_learning.h
    - hold_actions.h
  on_boot:
    # Ahead of every component, so the Zigbee component and the API server can
    # be held down before their own setup runs. A failed component never starts,
    # which is the only way to keep the 802.15.4 stack off: the ESP-Zigbee stack
    # has no stop and no restart, so the switch cannot lift this until the next boot.
    - priority: 800
      then:
        - lambda: |-
            if (!ZigbeeAssignmentManager::radio_enabled_from_flash()) {
              id(zigbee_radio)->mark_failed();
              zigbee_assignments.set_boot_gated(true);
              ESP_LOGI("zigbee_learn", "Zigbee radio is off, so the stack stays down");
            }
            // The API server has no stop and no restart either, so an off Home
            // Assistant switch holds it down the same way until the next boot.
            if (!button_config::ButtonConfig::ha_api_expected_from_flash()) {
              api::global_api_server->mark_failed();
              id(button_cfg).set_ha_api_gated(true);
              ESP_LOGI("button_config", "Home Assistant is off, so the API server stays down");
            }
            // Must run before any loop, so a held button cannot release first. A
            // button held through the boot fires no on_press. With wake press
            // replay off, its release must not tap. A later press clears the mark.
            if (id(idle).woke_from_sleep()) {
              const uint16_t held = id(idle).held_at_wake();
              const bool silent = !id(idle).wake_replay();
              for (uint8_t bit = 0; bit < 16; bit++) {
                if (held & (1u << bit))
                  hold_actions.wake_held(HoldActions::SLOT_OF_BIT[bit], silent);
              }
            }
    - priority: 600
      then:
        - lambda: ir_code_store.setup();
        - lambda: zigbee_assignments.setup();
        - lambda: id(ble_hid_remote).setup_assignments();
        # The awake LED restores on in its own setup, which runs after priority 800.
        - if:
            condition:
              lambda: return !id(button_cfg).status_leds();
            then:
              - light.turn_off:
                  id: awake_led
                  transition_length: 0s
        # Only a cold boot with the setting on plays the chase.
        - lambda: |-
            if (id(idle).woke_from_sleep() || !id(button_cfg).boot_leds())
              id(boot_chase_done) = true;
        - script.execute: show_idle_status
        # The sensor never polls. The API sends this stored state when Home Assistant subscribes.
        - component.update: web_page_url
  on_shutdown:
    - switch.turn_off: led_rail
    # Both pins to inputs so R10 holds Q2 off and DIN cannot feed the dead rail
    # through the LED input clamp. Pull GPIO17 down: the RMT driver can leave a
    # pull-up on it, which would sit on DIN.
    - lambda: |-
        gpio_set_direction(GPIO_NUM_17, GPIO_MODE_INPUT);
        gpio_set_pull_mode(GPIO_NUM_17, GPIO_PULLDOWN_ONLY);
        gpio_set_direction(GPIO_NUM_18, GPIO_MODE_INPUT);
        gpio_set_pull_mode(GPIO_NUM_18, GPIO_FLOATING);

esp32:
  board: seeed_xiao_esp32c6
  partitions: partitions.csv
  framework:
    type: esp-idf
    advanced:
      # A failed assert still aborts, but prints no file, line or expression.
      assertion_level: SILENT
    sdkconfig_options:
      # A pasted IR code posts up to 512 signed values, and ESPHome rejects a
      # POST body larger than this. The httpd scratch buffer grows on demand and
      # is freed with the request, so idle RAM is unchanged.
      CONFIG_HTTPD_MAX_REQ_HDR_LEN: "8192"
      # esp_err_to_name() then returns "UNKNOWN ERROR" for every code.
      CONFIG_ESP_ERR_TO_NAME_LOOKUP: "n"

external_components:
  - source:
      type: local
      path: components
  - source: github://luar123/zigbee_esphome@6cb5480cd2499faf9afb825754fa46b084296cb8
    components: [zigbee]

logger:
  level: INFO

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: false
  reboot_timeout: 0s
  # The Zigbee radio shares the antenna. Coexistence needs modem power save, or
  # the STA misses beacons and the connection flaps.
  power_save_mode: light
  on_connect:
    - script.execute: show_idle_status
  on_disconnect:
    - script.execute: show_idle_status

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic
  # No web_server, so no Visit link. The hostname survives a DHCP change and
  # already carries the MAC suffix.
  - platform: template
    id: web_page_url
    name: Web Page
    entity_category: diagnostic
    icon: mdi:web
    update_interval: never
    lambda: |-
      return "http://" + App.get_name() + ".local/";

ble_hid:
  id: ble_hid_remote

# Home Assistant actions over the native API. The ESPHome integration needs
# "Allow the device to perform Home Assistant actions" on this device.
ha_action:
  id: ha_actions

zigbee:
  id: zigbee_radio
  name: ${device_name}
  manufacturer: homeThing
  router: false
  sleepy: false
  endpoints:
    - num: 1
      device_type: ON_OFF_SWITCH
      # One client cluster for each action the web page can assign. A
      # cluster the simple descriptor omits still leaves the remote a valid
      # On/Off switch, but Zigbee2MQTT then reports no route for that command.
      clusters:
        - id: ON_OFF
          role: CLIENT
        - id: LEVEL
          role: CLIENT
        - id: COLOR_CONTROL
          role: CLIENT
        - id: SCENES
          role: CLIENT
        - id: WINDOW_COVERING
          role: CLIENT
        - id: THERMOSTAT
          role: CLIENT
        - id: DOOR_LOCK
          role: CLIENT
        - id: IAS_WD
          role: CLIENT
        - id: POWER_CONFIG
          attributes:
            # BatteryPercentageRemaining in 0.5 % units. 0xFF is the ZCL invalid value.
            - attribute_id: 0x0021
              type: UINT8
              # No access key: the component adds `access` to `report * 4`, which
              # fails for "force". Without it the SDK adds 0x0021 with its own flags.
              device: battery_level
              lambda: |-
                if (std::isnan(x))
                  return 0xFF;
                return static_cast<uint8_t>(std::lround(std::min(std::max(x, 0.0f), 100.0f) * 2.0f));
              report: force
  on_join:
    then:
      - lambda: zigbee_assignments.on_network_up(x);
      - script.execute: show_idle_status

# Serves the web page at / on port 80.
# The ESPHome entity page (web_server) is not built.
button_config:
  id: button_cfg
  idle_sleep_id: idle
  ha_action_id: ha_actions
  battery_level_id: battery_level
  battery_voltage_id: battery_voltage
  on_status_leds:
    - if:
        condition:
          lambda: return enabled;
        then:
          - lambda: |-
              auto call = id(awake_led).turn_on();
              call.set_brightness(0.3f);
              call.perform();
          - script.execute: show_idle_status
        else:
          - light.turn_off:
              id: awake_led
              transition_length: 0s
          # A running intro, radio switch pulse, sleep lap, status peek or open
          # assignment mode finishes first. The 250ms interval then turns the light off.
          - if:
              condition:
                lambda: |-
                  return !((!id(idle).woke_from_sleep() && !id(boot_chase_done) && id(button_cfg).boot_leds()) ||
                           millis() < id(wake_pulse_until_ms) || millis() < id(led_event_until_ms) ||
                           hold_actions.peeking() || ir_ui.state != IrUi::OFF);
              then:
                - light.turn_off:
                    id: status_light
                    transition_length: 0s

idle_sleep:
  id: idle
  # Default until the web page stores a value.
  sleep_after: 5min
  cold_boot_grace: 60s
  # The sleep hold is one of the configurable button holds, so HoldActions
  # times it and the 50ms interval calls arm_sleep(). The component's own hold
  # option stays unset.
  link_probe: !lambda return id(zigbee_radio).is_connected();
  block_probe: !lambda |-
    const bool ir_mode = ir_ui.state != IrUi::OFF;
    const bool mic_running = id(board_microphone).is_running();
    const bool meter = id(mic_meter_active);
    const bool voice = voice_assistant::global_voice_assistant->is_running();
    const bool pairing = zigbee_assignments.pairing();
    const bool window = zigbee_assignments.pairing_window_open();
    // Without Always On, an enabled Wi-Fi is the Wi-Fi hold or page session, or
    // the lease that a Home Assistant action holds.
    const bool wifi_session = !wifi::global_wifi_component->is_disabled() && !id(button_cfg).wifi_always_on();
    const bool ha_busy = id(ha_actions).busy();
    const uint8_t mask = ir_mode | mic_running << 1 | meter << 2 | voice << 3 | pairing << 4 | window << 5 |
                         wifi_session << 6 | ha_busy << 7;
    // 0xFF is out of range, so the first call logs the starting mask.
    static uint8_t last_mask = 0xFF;
    if (mask != last_mask) {
      last_mask = mask;
      ESP_LOGI("idle_sleep",
               "block=0x%02X ir=%d mic=%d meter=%d voice=%d pair=%d window=%d wifi=%d ha=%d at %" PRIu32 " ms", mask,
               ir_mode, mic_running, meter, voice, pairing, window, wifi_session, ha_busy, millis());
    }
    return mask != 0;
  replay: !lambda |-
    // The wake press replay setting gates this hook. An input with an active
    // hold taps on release, so its on_release owns a held bit.
    const uint8_t slot = HoldActions::SLOT_OF_BIT[bit];
    if (held && hold_actions.defers(slot))
      return false;
    // A Home Assistant action needs Wi-Fi and the API, not the Zigbee link, so
    // it queues at once. Every other kind waits for the link. play() is also
    // true when the Home Assistant switch skips the press, so the bit settles.
    if (id(ha_actions).play(slot))
      return true;
    return link && zigbee_assignments.play(slot);

i2c:
  sda: GPIO22
  scl: GPIO23
  frequency: 100kHz
  scan: true

pcf8574:
  - id: button_expander
    address: 0x20
    pcf8575: true

binary_sensor:
  # Every input below is assignable. The cycle is IR, Zigbee, voice, then clear.
  # Outside receiver mode the input replays its one active assignment. All
  # sixteen inputs share one press path and one release path. An input that
  # carries an active hold sends its assignment on release instead.
  - platform: gpio
    name: Button 1
    pin: &button_1
      pcf8574: button_expander
      number: 0
      mode: INPUT
      inverted: true
    on_press:
      - script.execute: {id: button_press, slot: 20}
    on_release:
      - script.execute: {id: button_release, slot: 20}
  - platform: gpio
    name: Button 2
    id: button_2
    pin:
      <<: *button_1
      number: 1
    on_press:
      - script.execute: {id: button_press, slot: 19}
    on_release:
      - script.execute: {id: button_release, slot: 19}
  - platform: gpio
    name: Button 3
    pin:
      <<: *button_1
      number: 2
    on_press:
      - script.execute: {id: button_press, slot: 3}
    on_release:
      - script.execute: {id: button_release, slot: 3}
  - platform: gpio
    name: Button 4
    pin:
      <<: *button_1
      number: 3
    on_press:
      - script.execute: {id: button_press, slot: 4}
    on_release:
      - script.execute: {id: button_release, slot: 4}
  - platform: gpio
    name: Button 5
    pin:
      <<: *button_1
      number: 4
    on_press:
      - script.execute: {id: button_press, slot: 5}
    on_release:
      - script.execute: {id: button_release, slot: 5}
  - platform: gpio
    name: Button 6
    pin:
      <<: *button_1
      number: 5
    on_press:
      - script.execute: {id: button_press, slot: 6}
    on_release:
      - script.execute: {id: button_release, slot: 6}
  - platform: gpio
    name: Button 7
    pin:
      <<: *button_1
      number: 6
    on_press:
      - script.execute: {id: button_press, slot: 7}
    on_release:
      - script.execute: {id: button_release, slot: 7}
  - platform: gpio
    name: Button 8
    pin:
      <<: *button_1
      number: 7
    on_press:
      - script.execute: {id: button_press, slot: 8}
    on_release:
      - script.execute: {id: button_release, slot: 8}
  - platform: gpio
    name: Button 9
    pin:
      <<: *button_1
      number: 9
    on_press:
      - script.execute: {id: button_press, slot: 9}
    on_release:
      - script.execute: {id: button_release, slot: 9}
  - platform: gpio
    name: Button 10
    pin:
      <<: *button_1
      number: 8
    on_press:
      - script.execute: {id: button_press, slot: 10}
    on_release:
      - script.execute: {id: button_release, slot: 10}
  - platform: gpio
    name: Button 11
    pin:
      <<: *button_1
      number: 10
    on_press:
      - script.execute: {id: button_press, slot: 11}
    on_release:
      - script.execute: {id: button_release, slot: 11}
  # ANO wheel on PCF8575 P13..P17. Directions verified on unit 1 2026-07-27 by
  # logging expander edges per press; they match the ENC1 symbol pin names, so
  # the part is mounted as drawn and there is no rotation to compensate for.
  - platform: gpio
    name: Wheel Right
    pin:
      <<: *button_1
      number: 11
    on_press:
      - script.execute: {id: button_press, slot: 12}
    on_release:
      - script.execute: {id: button_release, slot: 12}
  - platform: gpio
    name: Wheel Up
    pin:
      <<: *button_1
      number: 12
    on_press:
      - script.execute: {id: button_press, slot: 13}
    on_release:
      - script.execute: {id: button_release, slot: 13}
  - platform: gpio
    name: Wheel Press
    pin:
      <<: *button_1
      number: 13
    on_press:
      - script.execute: {id: button_press, slot: 14}
    on_release:
      - script.execute: {id: button_release, slot: 14}
  - platform: gpio
    name: Wheel Down
    pin:
      <<: *button_1
      number: 14
    on_press:
      - script.execute: {id: button_press, slot: 15}
    on_release:
      - script.execute: {id: button_release, slot: 15}
  - platform: gpio
    name: Wheel Left
    pin:
      <<: *button_1
      number: 15
    on_press:
      - script.execute: {id: button_press, slot: 16}
    on_release:
      - script.execute: {id: button_release, slot: 16}

sensor:
  - platform: rotary_encoder
    name: Wheel
    # A on GPIO19 makes a clockwise turn fire on_clockwise.
    pin_a:
      number: GPIO19
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO20
      mode:
        input: true
        pullup: true
    resolution: 2
    # Wheel rotation takes two more learn slots, so a volume pair can live on the
    # wheel instead of two of SW3..SW11. One detent is one send at resolution 2.
    # A detent has no release edge, so rotation stays out of the assignment cycle:
    # it always arms a capture and never reaches the voice or clear stages.
    # The shared button scripts reuse this transmit step.
    on_clockwise:
      - lambda: ir_ui.tap(17, IrUi::Tap::ARM_ONLY);
      - if: &send_learned_code
          condition:
            lambda: return ir_ui.take_transmit();
          then:
            - remote_transmitter.transmit_raw:
                carrier_frequency: 38kHz
                code: !lambda return ir_ui.code();
    on_anticlockwise:
      - lambda: ir_ui.tap(18, IrUi::Tap::ARM_ONLY);
      - if: *send_learned_code

  - platform: adc
    id: battery_voltage
    name: Battery Voltage
    pin: GPIO4
    # Auto attenuation cannot multisample. Samples average out Zigbee TX sag.
    attenuation: 12db
    samples: 16
    update_interval: 5s
    filters:
      - multiply: 2.0
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement

  - platform: copy
    source_id: battery_voltage
    id: battery_level
    name: Battery
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    filters:
      # Resting 1S LiPo curve (V to %), so a charging cell reads high.
      - lambda: |-
          if (std::isnan(x))
            return NAN;
          static const float CURVE[][2] = {{3.30f, 0.0f},  {3.61f, 5.0f},  {3.69f, 10.0f}, {3.73f, 20.0f},
                                           {3.76f, 30.0f}, {3.79f, 40.0f}, {3.82f, 50.0f}, {3.86f, 60.0f},
                                           {3.92f, 70.0f}, {4.00f, 80.0f}, {4.10f, 90.0f}, {4.20f, 100.0f}};
          const int last = sizeof(CURVE) / sizeof(CURVE[0]) - 1;
          if (x <= CURVE[0][0])
            return 0.0f;
          if (x >= CURVE[last][0])
            return 100.0f;
          int i = 1;
          while (x > CURVE[i][0])
            i++;
          const float t = (x - CURVE[i - 1][0]) / (CURVE[i][0] - CURVE[i - 1][0]);
          return CURVE[i - 1][1] + t * (CURVE[i][1] - CURVE[i - 1][1]);
      # Jitter must not publish, because each publish forces a Zigbee report.
      - delta: 2

output:
  # The XIAO user LED shows the remote is awake. It is lit from 3V3 when GPIO15 is
  # low. IdleSleep floats the pin for deep sleep.
  - platform: ledc
    id: awake_led_pwm
    pin:
      number: GPIO15
      # Strapping is sampled only at reset.
      ignore_strapping_warning: true
    inverted: true
    frequency: 1kHz

light:
  - platform: esp32_rmt_led_strip
    id: status_light
    name: Status Light
    pin: GPIO17
    chipset: WS2812
    rgb_order: GRB
    num_leds: 4
    # The C6 has two RMT TX channels of 48 symbols. Without this the strip takes
    # the 96-symbol default, remote_transmitter gets no channel and is marked
    # failed at boot, and every IR send returns silently.
    rmt_symbols: 48
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_lambda:
          name: Status Indicators
          update_interval: 50ms
          lambda: |-
            it.all() = Color::BLACK;

            // Boot chase: two clockwise laps before any status shows. Strip order
            // D2 D3 D4 D5 is already clockwise round the wheel. A deep-sleep wake
            // skips it. Eight 450 ms pulses start 150 ms apart, so each overlaps
            // the next two. Both times are multiples of the 50 ms tick. Each pulse
            // steps 1/8 of the hue wheel, so the two laps sweep one rainbow.
            static bool boot_chase = !id(idle).woke_from_sleep() && id(button_cfg).boot_leds();
            static const uint32_t boot_chase_start = millis();
            if (boot_chase) {
              const uint32_t t = millis() - boot_chase_start;
              if (t < 7 * 150 + 450) {
                for (uint32_t n = 0; n < 8; n++) {
                  const uint32_t start = n * 150;
                  if (t < start || t >= start + 450)
                    continue;
                  const float phase = (t - start) / 450.0f;
                  const uint8_t level = static_cast<uint8_t>(
                      160.0f * (0.5f - 0.5f * cosf(2.0f * static_cast<float>(M_PI) * phase)));
                  it[n % 4] = ESPHSVColor(n * 32, 255, level);
                }
                return;
              }
              boot_chase = false;
              id(boot_chase_done) = true;
            }

            // With status LEDs off or on hold, only a status peek or an open
            // assignment mode shows the status. Otherwise only an intro animation,
            // a radio switch pulse or the sleep lap draws.
            const bool status_on = id(button_cfg).status_leds() || hold_actions.peeking() || ir_ui.state != IrUi::OFF;

            // D2 stays dark while Wi-Fi is disabled. It pulses red while Wi-Fi
            // connects and orange on Wi-Fi alone when Home Assistant is expected.
            // Turning the HA switch off keeps solid orange while Wi-Fi is up.
            // Green is brighter than red on these 2020 parts at 3.3V, so orange
            // uses R:G = 2:1 (1:1 reads green, 3:1 reads red). A dark D2 stops
            // only a voice press: a Home Assistant press turns Wi-Fi on itself
            // while the Home Assistant switch is on.
            const bool wifi_enabled = !wifi::global_wifi_component->is_disabled();
            const bool wifi_connected = wifi::global_wifi_component->is_connected();
            const bool api_connected = api::global_api_server->is_connected();
            const bool ha_expected = id(button_cfg).ha_api_expected();
            if (wifi_enabled && api_connected) {
              it[0] = Color(0, 96, 24);
            } else if (wifi_enabled && !wifi_connected) {
              const float phase = (millis() % 4800) / 4800.0f;
              // Input 122 produces 3/255 after 40% brightness and gamma correction.
              const uint8_t level = 122 + static_cast<uint8_t>(
                  64.0f * (0.5f - 0.5f * cosf(2.0f * static_cast<float>(M_PI) * phase)));
              it[0] = Color(level, 0, 0);
            } else if (wifi_enabled && ha_expected) {
              const float phase = (millis() % 4800) / 4800.0f;
              // Below input 140 the green half corrects to 0/255, so the trough reads red.
              const uint8_t level = 140 + static_cast<uint8_t>(
                  50.0f * (0.5f - 0.5f * cosf(2.0f * static_cast<float>(M_PI) * phase)));
              it[0] = Color(level, level / 2, 0);
            } else if (wifi_enabled) {
              it[0] = Color(140, 70, 0);
            }

            // A failed Home Assistant action blinks D2 red for two seconds. The
            // status LED switch still applies below.
            if (id(ha_actions).failed_recently())
              it[0] = ((millis() / 150) % 2) == 0 ? Color(200, 0, 0) : Color::BLACK;

            // D3 and D4 show assignment mode when it is open, otherwise
            // voice-assistant state. When both are idle, D4 shows Bluetooth
            // and D3 stays dark. The wake battery overlay below can cover them.
            // Assignment mode never writes D2 or D5, so a Wi-Fi or Zigbee fault
            // stays visible while an input is trained.
            if (ir_ui.state != IrUi::OFF) {
              if (ir_ui.state == IrUi::READING) {
                // Two LEDs at 300 ms keep the former four-LED 600 ms chase.
                it[1 + ((millis() / 300) % 2)] = Color(0, 0, 200);
              } else {
                const float mode_phase = (millis() % 1200) / 1200.0f;
                const uint8_t mode_level = 40 + static_cast<uint8_t>(
                    160.0f * (0.5f - 0.5f * cosf(2.0f * static_cast<float>(M_PI) * mode_phase)));
                Color mode = Color::BLACK;
                if (ir_ui.state == IrUi::READY) {
                  mode = Color(0, 0, 160);
                } else if (ir_ui.state == IrUi::SAVED) {
                  mode = Color(0, 180, 0);
                } else if (ir_ui.state == IrUi::ERROR && ((millis() / 150) % 2) == 0) {
                  mode = Color(200, 0, 0);
                } else if (ir_ui.state == IrUi::VOICE) {
                  mode = Color(0, 0, mode_level);
                } else if (ir_ui.state == IrUi::CLEARED) {
                  mode = Color(160, 80, 0);
                }
                it[1] = mode;
                it[2] = mode;
              }
            } else if (id(voice_led_state) == 1) {
              it[1] = Color(192, 48, 0);
              it[2] = Color(192, 48, 0);
            } else if (id(voice_led_state) == 2) {
              it[1] = Color(0, 48, 255);
              it[2] = Color(0, 48, 255);
            } else if (id(voice_led_state) == 3) {
              it[1] = Color(96, 0, 96);
              it[2] = Color(96, 0, 96);
            } else if (id(voice_led_state) == 4) {
              it[1] = Color(255, 0, 0);
              it[2] = Color(255, 0, 0);
            } else {
              auto *ble = id(ble_hid_remote);
              if (!ble->radio_enabled()) {
                it[2] = Color::BLACK;
              } else if (ble->stack_failed()) {
                it[2] = Color(255, 0, 0);
              } else if (ble->connected()) {
                it[2] = Color(0, 128, 0);
              } else if (ble->pair_failed_recently()) {
                it[2] = ((millis() / 150) % 2) == 0 ? Color(200, 0, 0) : Color::BLACK;
              } else if (ble->pairing() || !ble->bonded()) {
                const float phase = (millis() % 1600) / 1600.0f;
                const uint8_t level = 48 + static_cast<uint8_t>(
                    144.0f * (0.5f - 0.5f * cosf(2.0f * static_cast<float>(M_PI) * phase)));
                it[2] = Color(0, 0, level);
              } else {
                // A stored bond that has not reconnected uses the D5 stored-network yellow.
                it[2] = Color(192, 128, 0);
              }
            }

            // D5 is Zigbee status during normal operation. A radio switched off
            // sends nothing, and a radio the boot gate holds down never starts,
            // so both stay dark. Pairing is tested before the join, so an open
            // window never shows the red that means a fault. A join closes the
            // window itself. factory_new_ reads false until the stack starts, so
            // an unjoined radio shows the stored-network yellow until a
            // factory-new start drops it to red. Yellow uses R:G = 3:2, between
            // the 1:1 that reads green and the 2:1 amber.
            if (!zigbee_assignments.radio_enabled() || zigbee_assignments.boot_gated()) {
              it[3] = Color::BLACK;
            } else if (zigbee_assignments.pairing_window_open()) {
              const float phase = (millis() % 1600) / 1600.0f;
              const uint8_t level = 48 + static_cast<uint8_t>(
                  144.0f * (0.5f - 0.5f * cosf(2.0f * static_cast<float>(M_PI) * phase)));
              it[3] = Color(0, 0, level);
            } else if (!id(zigbee_radio).is_connected()) {
              if (!zigbee_assignments.pairing() && !id(zigbee_radio)->factory_new_.load()) {
                it[3] = Color(192, 128, 0);
              } else if (!id(zigbee_radio).is_started()) {
                it[3] = Color::BLACK;
              } else {
                const float phase = (millis() % 3200) / 3200.0f;
                const uint8_t level = 48 + static_cast<uint8_t>(
                    144.0f * (0.5f - 0.5f * cosf(2.0f * static_cast<float>(M_PI) * phase)));
                it[3] = Color(level, 0, 0);
              }
            } else if (zigbee_assignments.reach() == ZigbeeAssignmentManager::REACH_FAILED) {
              // Only a device unicast is acknowledged, so a groupcast-only
              // remote never reaches this and stays solid green.
              const float phase = (millis() % 4000) / 4000.0f;
              const uint8_t level = 48 + static_cast<uint8_t>(
                  144.0f * (0.5f - 0.5f * cosf(2.0f * static_cast<float>(M_PI) * phase)));
              it[3] = Color(level, level / 2, 0);
            } else {
              it[3] = Color(0, 128, 0);
            }

            // Deep-sleep wake: two pulses in the battery colour cover the status
            // LEDs. Assignment mode and voice feedback keep D3 and D4, because
            // they answer a user action. The countdown phase starts and stops dim.
            if (!status_on)
              it.all() = Color::BLACK;
            if (millis() < id(wake_pulse_until_ms)) {
              const float phase = ((id(wake_pulse_until_ms) - millis()) % 800) / 800.0f;
              const float wave = 0.5f - 0.5f * cosf(2.0f * static_cast<float>(M_PI) * phase);
              Color pulse;
              switch (id(wake_battery_band)) {
                case 1: {
                  const uint8_t level = 48 + static_cast<uint8_t>(144.0f * wave);
                  pulse = Color(0, level, 0);
                  break;
                }
                case 2: {
                  // Same envelope as the D2 orange, so the green half stays above the gamma floor.
                  const uint8_t level = 140 + static_cast<uint8_t>(50.0f * wave);
                  pulse = Color(level, level / 2, 0);
                  break;
                }
                case 3: {
                  const uint8_t level = 48 + static_cast<uint8_t>(144.0f * wave);
                  pulse = Color(level, 0, 0);
                  break;
                }
                default: {
                  const uint8_t level = 24 + static_cast<uint8_t>(136.0f * wave);
                  pulse = Color(level, level, level);
                  break;
                }
              }
              it[0] = pulse;
              it[3] = pulse;
              if (!status_on || (ir_ui.state == IrUi::OFF && id(voice_led_state) == 0)) {
                it[1] = pulse;
                it[2] = pulse;
              }
            }

            // Radio switch with status LEDs off: one 800 ms pulse on the LED of
            // that radio, green for on and red for off. It draws after the wake
            // pulse, so it covers the wake pulse on that LED.
            if (!status_on) {
              // One read, so the phase cannot wrap past the end.
              const uint32_t now = millis();
              for (uint8_t n = 0; n < 4; n++) {
                const uint32_t end = id(radio_pulse_end_ms)[n];
                if (now < end) {
                  const float phase = (end - now) / 800.0f;
                  const uint8_t level = static_cast<uint8_t>(
                      192.0f * (0.5f - 0.5f * cosf(2.0f * static_cast<float>(M_PI) * phase)));
                  it[n] = ((id(radio_pulse_red) >> n) & 1) ? Color(level, 0, 0) : Color(0, level, 0);
                }
              }
            }

            // The sleep hold armed sleep, with any LED setting: one anticlockwise lap
            // D5 D4 D3 D2 in the boot chase timing, then dark until the release
            // sleeps. It draws last, so it covers every other layer.
            if (id(idle).sleep_armed()) {
              it.all() = Color::BLACK;
              const uint32_t t = millis() - id(sleep_lap_start_ms);
              for (uint32_t n = 0; n < 4; n++) {
                const uint32_t start = n * 150;
                if (t < start || t >= start + 450)
                  continue;
                const float phase = (t - start) / 450.0f;
                const uint8_t level = static_cast<uint8_t>(
                    160.0f * (0.5f - 0.5f * cosf(2.0f * static_cast<float>(M_PI) * phase)));
                it[3 - n] = Color(level / 3, level / 3, level);
              }
            }
    on_turn_on:
      # One gate for every caller. Only a status setting, a running intro, a
      # radio switch pulse, a sleep lap, a status peek or an open assignment
      # mode powers the rail, so GPIO17 never drives frames into a dead led_vdd.
      # Each opener sets the mode state before it turns the light on. A close
      # runs show_idle_status, so this gate darkens the strip again.
      - if:
          condition:
            lambda: |-
              return id(button_cfg).status_leds() ||
                     (!id(idle).woke_from_sleep() && !id(boot_chase_done) && id(button_cfg).boot_leds()) ||
                     millis() < id(wake_pulse_until_ms) ||
                     millis() < id(led_event_until_ms) ||
                     hold_actions.peeking() || ir_ui.state != IrUi::OFF;
          then:
            - switch.turn_on: led_rail
            # The first frame is written in the same loop tick as this trigger, before
            # led_vdd has risen at D2, so re-send it once the rail is up.
            - delay: 20ms
            # Guarded: a turn-off inside the 20ms window would otherwise be undone.
            - if:
                condition:
                  light.is_on: status_light
                then:
                  - light.turn_on: status_light
          else:
            - light.turn_off:
                id: status_light
                transition_length: 0s
    on_turn_off:
      # Fires one write before the final all-black frame, so let that frame land
      # while the LEDs still have power. GPIO17 then idles low.
      - delay: 100ms
      - if:
          condition:
            light.is_off: status_light
          then:
            - switch.turn_off: led_rail

  - platform: monochromatic
    id: awake_led
    name: Awake LED
    output: awake_led_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    on_turn_on:
      - if:
          condition:
            lambda: return !id(button_cfg).status_leds();
          then:
            - light.turn_off:
                id: awake_led
                transition_length: 0s
    # Without color_mode the boot call drops the brightness and turns on at 100%.
    initial_state:
      color_mode: brightness
      brightness: 30%

switch:
  # Q2 is a high-side P-FET on the LED rail: gate low powers led_vdd, so the
  # switch pin is inverted. R10 1M holds the gate at +3.3V, so the rail is off
  # whenever GPIO18 floats (boot, deep sleep).
  - platform: gpio
    name: LED Rail
    id: led_rail
    entity_category: config
    pin:
      number: GPIO18
      inverted: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      # Interlock. Turning this switch off by hand while the light is on leaves
      # the RMT writing frames into a dead rail, so blank the light first. The
      # light's own on_turn_off then calls switch.turn_off again, which re-fires
      # this trigger once and stops on the guard.
      - if:
          condition:
            light.is_on: status_light
          then:
            - light.turn_off: status_light

  # Q3 is a high-side P-FET on the IR receiver rail: gate low powers ir_vdd, so
  # the switch pin is inverted. R11 1M holds the gate at +3.3V, so the rail is
  # off whenever GPIO6 floats. This one defaults ON, unlike the LED rail, because
  # remote_receiver cannot decode with U2 unpowered. Turning it off while awake
  # leaks: GPIO16's pullup feeds U2's internal 30k to a dead Vs, roughly 44uA,
  # which partially powers the rail. Deep sleep releases the pullup, so the 350uA
  # is only reclaimable there.
  - platform: gpio
    name: IR Rail
    id: ir_rail
    entity_category: config
    pin:
      number: GPIO6
      inverted: true
    restore_mode: ALWAYS_ON

  # Both radio switches keep their state in the assignment record of the radio
  # they gate, so the remote restores them itself and needs no restore_mode. The
  # web page writes the same two flags.
  - platform: template
    name: Zigbee Radio
    id: zigbee_radio_enable
    entity_category: config
    # DISABLED, because the manager owns the state. The template default,
    # ALWAYS_OFF, fires turn_off_action at every boot and would switch the radio
    # off before on_boot has read the stored flag.
    restore_mode: DISABLED
    lambda: return zigbee_assignments.radio_enabled();
    turn_on_action:
      - lambda: zigbee_assignments.set_radio_enabled(true);
    turn_off_action:
      - lambda: zigbee_assignments.set_radio_enabled(false);

  # Off skips the NimBLE bring-up at boot, so the first turn-on starts the stack.
  - platform: template
    name: Bluetooth Radio
    id: ble_radio_enable
    entity_category: config
    restore_mode: DISABLED
    lambda: return id(ble_hid_remote).radio_enabled();
    turn_on_action:
      - lambda: id(ble_hid_remote).set_radio_enabled(true);
    turn_off_action:
      - lambda: id(ble_hid_remote).set_radio_enabled(false);

  # Off stops the Home Assistant actions at once and the API server from the
  # next boot on. Home Assistant then cannot reach this switch, so only the
  # web page can turn it back on. D2 stays solid orange on Wi-Fi alone.
  - platform: template
    name: Home Assistant API
    id: ha_api_expected
    entity_category: config
    restore_mode: DISABLED
    lambda: return id(button_cfg).ha_api_expected();
    turn_on_action:
      - lambda: id(button_cfg).set_ha_api_expected(true);
    turn_off_action:
      - lambda: id(button_cfg).set_ha_api_expected(false);

remote_receiver:
  pin:
    number: GPIO16
    mode:
      input: true
      pullup: true
    inverted: true
  tolerance: 35%
  on_raw:
    - lambda: |-
        ir_code_store.log_received(x);
        ir_ui.captured(x);

remote_transmitter:
  pin: GPIO1
  carrier_duty_percent: 50%
  non_blocking: true
  # Share ESP32-C6 TX RMT memory with the status LED strip.
  rmt_symbols: 48

# MK1 I2S. GPIO0 is WS and GPIO21 is data in, not the other way round: the two
# swapped at the XIAO when MK1 was rerouted. Getting them backwards drives
# LRCLK onto the mic's SD output and makes two drivers fight.
i2s_audio:
  id: mic_bus
  i2s_bclk_pin: GPIO2
  i2s_lrclk_pin: GPIO0

microphone:
  - platform: i2s_audio
    id: board_microphone
    i2s_audio_id: mic_bus
    i2s_din_pin: GPIO21
    adc_type: external
    pdm: false
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit

script:
  # Shared press path for the sixteen expander inputs. HoldActions latches the
  # hold decision here, so a settings change during a hold does not move it.
  - id: button_press
    mode: parallel
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: return hold_actions.press(static_cast<uint8_t>(slot), millis());
          then:
            - lambda: ir_ui.tap(static_cast<uint8_t>(slot), IrUi::Tap::FULL);
            - if: *send_learned_code
            - if: &start_learned_voice
                condition:
                  lambda: return ir_ui.take_voice_start();
                then:
                  # Without a subscribed client, voice_assistant.start only logs and fires
                  # no trigger, so the meter would stay set and block sleep. An off switch
                  # refuses at once, although the API server runs until the next boot.
                  - if:
                      condition:
                        and:
                          - lambda: return id(button_cfg).ha_api_expected();
                          - voice_assistant.connected:
                      then:
                        # A refusal window still open would clear the meter of this start.
                        - script.stop: refuse_voice_start
                        - lambda: |-
                            id(voice_led_state) = 1;
                            id(mic_meter_active) = true;
                        - light.turn_on:
                            id: status_light
                            effect: Status Indicators
                            brightness: 40%
                        # Home Assistant VAD ends the stream, so there is no stop on a timer.
                        - voice_assistant.start:
                      else:
                        - script.execute: refuse_voice_start
  # Shared release path. A deferred press taps here, and Home Assistant VAD ends
  # a voice tap. A release after the hold fired sends nothing.
  - id: button_release
    mode: parallel
    parameters:
      slot: int
    then:
      - lambda: id(hold_release) = hold_actions.release(static_cast<uint8_t>(slot));
      - if:
          condition:
            lambda: return id(hold_release) == HoldActions::TAP_AND_RELEASE;
          then:
            - lambda: ir_ui.tap(static_cast<uint8_t>(slot), IrUi::Tap::FULL);
            - if: *send_learned_code
            - if: *start_learned_voice
            - lambda: ir_ui.release(static_cast<uint8_t>(slot));
      - if:
          condition:
            lambda: return id(hold_release) == HoldActions::RELEASE_ONLY;
          then:
            - script.execute:
                id: release_assignment
                slot: !lambda return slot;
  - id: release_assignment
    mode: parallel
    parameters:
      slot: int
    then:
      - if:
          condition:
            lambda: return ir_ui.release(static_cast<uint8_t>(slot));
          then:
            - voice_assistant.stop:
  - id: show_idle_status
    then:
      - if:
          condition:
            lambda: return !id(mic_meter_active);
          then:
            - lambda: |-
                id(voice_led_state) = 0;
                ESP_LOGD("main", "VA LED: 0 (idle)");
            - light.turn_on:
                id: status_light
                effect: Status Indicators
                brightness: 40%
  - id: stop_voice_listening
    then:
      - lambda: id(mic_meter_active) = false;
      - script.execute: show_idle_status
  # The on_error LED state, without the meter, so a refused press cannot block
  # sleep. restart keeps one 2 s window when presses repeat.
  - id: refuse_voice_start
    mode: restart
    then:
      - lambda: |-
          if (!id(button_cfg).ha_api_expected())
            ESP_LOGW("voice_assistant", "Voice start refused: the Home Assistant switch is off");
          else if (id(button_cfg).ha_api_gated())
            ESP_LOGW("voice_assistant", "Voice start refused: the API server is off until the next restart");
          else
            ESP_LOGW("voice_assistant", "Voice start refused: no Home Assistant client is subscribed to voice");
          id(voice_led_state) = 4;
      - light.turn_on:
          id: status_light
          effect: Status Indicators
          brightness: 40%
      - delay: 2s
      - script.execute: stop_voice_listening

voice_assistant:
  # gain_factor is applied in the Q31 domain before the 32-to-16 bit truncation,
  # so it recovers the mic's low bits rather than amplifying quantization noise.
  # The ICS-43434 is -26 dBFS at 94 dB SPL, which puts speech near -54 dBFS raw.
  microphone:
    - microphone: board_microphone
      gain_factor: 32
  # noise_suppression_level, auto_gain and volume_multiplier are applied by HA's
  # server-side enhancer, not on the device. Left at defaults: with them set to
  # 2 / 31dBFS / 2.0 HA aborted the stream 7.6s in with stt-stream-failed.
  # gain_factor above is device-side and unaffected.
  on_start:
    - logger.log: "VA: pipeline start requested"
  on_listening:
    # The LEDs are the cue to start talking, so they light here rather than on
    # the button press: HA's reply can lag the request by seconds, and audio
    # captured before streaming opens is discarded.
    - logger.log: "VA: listening"
    - lambda: |-
        id(voice_led_state) = 2;
        ESP_LOGD("main", "VA LED: 2 (listening)");
    - light.turn_on:
        id: status_light
        effect: Status Indicators
        brightness: 40%
  on_stt_vad_start:
    - logger.log: "VA: speech detected"
  on_stt_vad_end:
    - logger.log: "VA: speech ended"
    - lambda: id(mic_meter_active) = false;
    - lambda: |-
        id(voice_led_state) = 3;
        ESP_LOGD("main", "VA LED: 3 (speech ended)");
    - light.turn_on:
        id: status_light
        effect: Status Indicators
        brightness: 40%
  on_stt_end:
    - lambda: |-
        ESP_LOGI("voice_assistant", "STT result: '%s'", x.c_str());
  on_end:
    - script.execute: stop_voice_listening
  on_error:
    - lambda: |-
        ESP_LOGE("voice_assistant", "Error %s / %s", code.c_str(), message.c_str());
    - lambda: id(mic_meter_active) = false;
    - lambda: |-
        id(voice_led_state) = 4;
        ESP_LOGD("main", "VA LED: 4 (voice-assistant error)");
    - light.turn_on:
        id: status_light
        effect: Status Indicators
        brightness: 40%
    - delay: 2s
    - script.execute: stop_voice_listening
  on_client_disconnected:
    - script.execute: stop_voice_listening

globals:
  # HoldActions::release() of the running release path. Nothing between the write
  # and the two reads can run another release.
  - id: hold_release
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: mic_meter_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: voice_led_state
    type: uint8_t
    restore_value: false
    initial_value: "0"
  # The wake interval sets this after a deep-sleep wake. All four LEDs pulse twice in the battery colour until it passes.
  - id: wake_pulse_until_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # Battery colour latched on the first wake tick. 0 unknown, 1 green, 2 orange, 3 red.
  # True once the cold-boot chase ended or cannot play this boot.
  - id: boot_chase_done
    type: bool
    restore_value: false
    initial_value: "false"
  - id: wake_battery_band
    type: uint8_t
    restore_value: false
    initial_value: "0"
  # Latest end of any short LED event: a radio switch pulse or the sleep lap.
  # The three status_light gates read it.
  - id: led_event_until_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # Arm time of the sleep hold. The sleep lap counts from it.
  - id: sleep_lap_start_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # Pulse end for each strip LED. D3, index 1, has no radio.
  - id: radio_pulse_end_ms
    type: uint32_t[4]
    restore_value: false
    initial_value: "{0, 0, 0, 0}"
  # Bit n set: strip LED n pulses red for a radio switched off. Clear: green for on.
  - id: radio_pulse_red
    type: uint8_t
    restore_value: false
    initial_value: "0"

interval:
  - interval: 250ms
    then:
      - lambda: |-
          // open_from_web() set the mode state already, so the on_turn_on gate powers the rail.
          if (ir_ui.take_open_request()) {
            id(ir_rail).turn_on();
            id(status_light).turn_on().set_brightness(0.4f).set_effect("Status Indicators").perform();
          }
          if (ir_ui.tick())
            id(show_idle_status).execute();
          // With status LEDs off the light stays on only for an intro, a radio switch pulse,
          // a sleep lap, a status peek or an open assignment mode. tick() runs first,
          // so a close on this tick already reads OFF here.
          if (!id(button_cfg).status_leds() && id(status_light).remote_values.is_on() &&
              !((!id(idle).woke_from_sleep() && !id(boot_chase_done) && id(button_cfg).boot_leds()) ||
                millis() < id(wake_pulse_until_ms) || millis() < id(led_event_until_ms) ||
                hold_actions.peeking() || ir_ui.state != IrUi::OFF))
            id(status_light).turn_off().set_transition_length(0).perform();
          // The Zigbee component exports no global instance, so the link state
          // is pushed from here, where the id is in scope. It comes before the
          // tick, so a pairing step reads this boot and not the last one.
          zigbee_assignments.set_link_state(id(zigbee_radio).is_started(),
                                            id(zigbee_radio).is_connected(),
                                            id(zigbee_radio)->factory_new_.load());
          zigbee_assignments.tick();
          // Pairing cannot steer while an older join is still in NVS. This
          // erases only the "zigbee" NVS namespace, so every button assignment
          // in the "esphome" namespace survives it. The call does not return:
          // it restarts the remote, and the stored request runs the window on
          // the boot after it.
          if (zigbee_assignments.take_credential_erase_request())
            id(zigbee_radio)->reset();
  - interval: 50ms
    then:
      # Its own step, because the wake step below returns early after a cold boot.
      - lambda: |-
          // A slow setup ticks intervals before ButtonConfig loads the hold buttons.
          if (!App.is_setup_complete())
            return;
          const uint8_t fired = hold_actions.tick(millis());
          if (fired & (1u << HoldActions::WIFI))
            id(button_cfg).toggle_temporary_wifi();
          // peeking() and open() set their state first, so the on_turn_on gate powers the rail.
          if (fired & (1u << HoldActions::STATUS))
            id(status_light).turn_on().set_brightness(0.4f).set_effect("Status Indicators").perform();
          if (fired & (1u << HoldActions::SLEEP))
            id(idle).arm_sleep();
          if (fired & (1u << HoldActions::ASSIGN)) {
            if (ir_ui.state == IrUi::OFF) {
              ir_ui.open();
              id(ir_rail).turn_on();
              id(status_light).turn_on().set_brightness(0.4f).set_effect("Status Indicators").perform();
            } else {
              ir_ui.close();
            }
          }
      # Its own step, because the wake step below returns early after a cold boot.
      - lambda: |-
          // With status LEDs off, a radio switch starts one pulse on its strip LED.
          // The first call only takes the baseline, so a boot or a wake plays none.
          // A slow setup ticks intervals before ButtonConfig enables Wi-Fi, so wait.
          if (!App.is_setup_complete())
            return;
          bool on[4] = {};
          on[0] = !wifi::global_wifi_component->is_disabled();
          on[2] = id(ble_hid_remote).radio_enabled();
          on[3] = zigbee_assignments.radio_enabled();
          static bool last[4] = {on[0], on[1], on[2], on[3]};
          const uint32_t now = millis();
          bool started = false;
          for (uint8_t n = 0; n < 4; n++) {
            if (on[n] == last[n])
              continue;
            last[n] = on[n];
            if (id(button_cfg).status_leds())
              continue;
            id(radio_pulse_end_ms)[n] = now + 800;
            if (on[n])
              id(radio_pulse_red) &= ~(1u << n);
            else
              id(radio_pulse_red) |= 1u << n;
            started = true;
          }
          if (!started)
            return;
          // Set before the turn-on, so the on_turn_on gate powers the rail. The max
          // keeps a running sleep lap.
          id(led_event_until_ms) = std::max<uint32_t>(id(led_event_until_ms), now + 800);
          id(status_light).turn_on().set_brightness(0.4f).set_effect("Status Indicators").perform();
      - lambda: |-
          // One flash when the sleep hold arms sleep, so the user knows to let go.
          static bool was_armed = false;
          const bool armed = id(idle).sleep_armed();
          if (armed && !was_armed && id(button_cfg).status_leds()) {
            auto call = id(awake_led).turn_on();
            call.set_brightness(1.0f);
            call.set_flash_length(250);
            call.perform();
          }
          // The sleep lap ignores both LED settings, so a dark remote still shows the arm.
          if (armed && !was_armed) {
            const uint32_t now = millis();
            id(sleep_lap_start_ms) = now;
            // Set before the turn-on, so the on_turn_on gate powers the rail. The max
            // keeps a running radio switch pulse.
            id(led_event_until_ms) = std::max<uint32_t>(id(led_event_until_ms), now + 900);
            id(status_light).turn_on().set_brightness(0.4f).set_effect("Status Indicators").perform();
          }
          was_armed = armed;
          if (!id(idle).woke_from_sleep())
            return;
          // A button held from sleep published its first state without on_press,
          // so its hold starts here. With wake press replay on, its release taps
          // like a normal press. With it off, on_boot marked the release silent.
          // The hold itself starts in both cases, except assignment mode.
          // ButtonConfig loads the hold buttons in setup, so wait for it.
          static bool held_checked = false;
          if (!held_checked && App.is_setup_complete()) {
            held_checked = true;
            const uint16_t held = id(idle).held_at_wake();
            const uint32_t now = millis();
            // Raw expander level, low is pressed. IdleSleep's last read can predate
            // the binary sensor's first read, so read again. A hold for a button
            // already up has no on_release to stop it.
            for (uint8_t bit = 0; bit < 16; bit++) {
              if ((held & (1u << bit)) && !id(button_expander)->digital_read(bit))
                hold_actions.wake_start(HoldActions::SLOT_OF_BIT[bit], now);
            }
          }
          if (!id(button_cfg).boot_leds())
            return;
          // The first wake tick forces a sample, because the scheduled one can come
          // after the pulse starts. The latch keeps the colour fixed mid-pulse.
          static const uint8_t band = []() -> uint8_t {
            id(battery_voltage).update();
            const float pct = id(battery_level).state;
            if (std::isnan(pct))
              return 0;
            return pct >= 60.0f ? 1 : pct >= 30.0f ? 2 : 3;
          }();
          id(wake_battery_band) = band;
          // Setup can run past 800 ms, so the two pulses count from the first tick.
          static const uint32_t first_ms = millis();
          id(wake_pulse_until_ms) = first_ms + 1600;
          // With status LEDs off the light is dark here, and the gate now sees the pulse.
          static bool lit = false;
          if (!lit) {
            lit = true;
            if (!id(button_cfg).status_leds())
              id(status_light).turn_on().set_brightness(0.4f).set_effect("Status Indicators").perform();
          }

button:
  # The Zigbee stack starts only at boot, so turning its switch back on needs
  # this. Nothing else on the device offers a restart.
  - platform: restart
    name: Restart
