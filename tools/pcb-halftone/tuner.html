<!doctype html>
<meta charset="utf-8">
<title>homeThing PCB halftone tuner</title>
<section id="c6-halftone-tuner" aria-label="PCB halftone tuner">
  <style>
    #c6-halftone-tuner { display:grid; gap:1rem; max-width:720px; }
    #c6-halftone-tuner .sliders { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.75rem; }
    #c6-halftone-tuner .slider-label { display:flex; gap:.4rem; justify-content:space-between; align-items:baseline; }
    #c6-halftone-tuner .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:.65rem; }
    #c6-halftone-tuner .toolbar label { display:flex; align-items:center; gap:.5rem; }
    #c6-halftone-tuner .boards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1rem; max-width:340px; }
    #c6-halftone-tuner .boards[data-view="detail"] { max-width:560px; }
    #c6-halftone-tuner figure { margin:0; min-width:0; display:grid; gap:.35rem; }
    #c6-halftone-tuner canvas { display:block; width:100%; aspect-ratio:36.9824 / 129.9972; }
    #c6-halftone-tuner .boards[data-view="detail"] canvas { aspect-ratio:36.9824 / 34; }
    @media (max-width:460px) { #c6-halftone-tuner .sliders { grid-template-columns:1fr; gap:.3rem; } }
  </style>
  <div class="text-small">Adjusting front only. Back is locked to your saved preset.</div>
  <div class="sliders" role="group" aria-label="Front ripple controls">
    <label class="form-label">
      <span class="slider-label">Max dot diameter <output class="tabular-nums" for="c6ht-maxDiameter">1.05 mm</output></span>
      <input id="c6ht-maxDiameter" data-setting="maxDiameter" class="form-range" type="range" min="30" max="160" step="1" value="105">
    </label>
    <label class="form-label">
      <span class="slider-label">Highlights <output class="tabular-nums" for="c6ht-highlights">45%</output></span>
      <input id="c6ht-highlights" data-setting="highlights" class="form-range" type="range" min="20" max="220" step="5" value="45">
    </label>
    <label class="form-label">
      <span class="slider-label">Small ripples <output class="tabular-nums" for="c6ht-shadows">50%</output></span>
      <input id="c6ht-shadows" data-setting="shadows" class="form-range" type="range" min="0" max="200" step="5" value="50">
    </label>
  </div>
  <div class="sliders cloud-sliders" role="group" aria-label="Front shadow and fill controls">
    <label class="form-label">
      <span class="slider-label">Shadow amount <output class="tabular-nums" for="c6ht-cloudAmount">42%</output></span>
      <input id="c6ht-cloudAmount" data-setting="cloudAmount" class="form-range" type="range" min="0" max="100" step="1" value="42">
    </label>
    <label class="form-label">
      <span class="slider-label">Shadow size <output class="tabular-nums" for="c6ht-cloudSize">12 mm</output></span>
      <input id="c6ht-cloudSize" data-setting="cloudSize" data-unit=" mm" class="form-range" type="range" min="8" max="65" step="1" value="12">
    </label>
    <label class="form-label">
      <span class="slider-label">Minimum density <output class="tabular-nums" for="c6ht-minDensity">100%</output></span>
      <input id="c6ht-minDensity" data-setting="minDensity" class="form-range" type="range" min="0" max="100" step="1" value="100">
    </label>
  </div>
  <div class="sliders" role="group" aria-label="Front contrast">
    <label class="form-label">
      <span class="slider-label">Contrast <output class="tabular-nums" for="c6ht-contrast">100%</output></span>
      <input id="c6ht-contrast" data-setting="contrast" class="form-range" type="range" min="0" max="100" step="1" value="100">
    </label>
  </div>
  <div class="toolbar">
    <label class="form-label">View
      <select class="form-select" data-view-control>
        <option value="full">Full boards</option>
        <option value="detail">Switches and wordmark</option>
      </select>
    </label>
    <span class="text-muted text-small" data-status aria-live="polite"></span>
  </div>
  <div class="boards" data-view="full">
    <figure>
      <canvas data-side="front" aria-label="Front PCB preview with adjustable halftone ripples">Front PCB preview</canvas>
      <figcaption>Front</figcaption>
    </figure>
    <figure>
      <canvas data-side="back" aria-label="Back PCB preview with locked halftone settings">Back PCB preview</canvas>
      <figcaption>Back · locked</figcaption>
    </figure>
  </div>

  <script>
  (() => {
    const root = document.getElementById("c6-halftone-tuner");
    const data = JSON.parse(root.querySelector("#c6ht-geometry").textContent);
    const controls = [...root.querySelectorAll("[data-setting]")];
    const backSettings = Object.freeze({
      maxDiameter: 160,
      highlights: 30,
      shadows: 65,
      cloudAmount: 67,
      cloudSize: 12,
      minDensity: 100
    });
    const view = root.querySelector("[data-view-control]");
    const boards = root.querySelector(".boards");
    const status = root.querySelector("[data-status]");
    const width = 36.9824;
    const height = 129.9972;
    const gap = .10;
    const minRadius = .09;
    const boardInk = "#f8edd5";

    function prepare(side, item) {
      const dots = item.dots;
      const values = dots.map(dot => dot[2]);
      const low = Math.min(...values);
      const span = Math.max(...values) - low;
      const neighbors = [];
      const bins = new Map();
      const binSize = 2;
      for (let i = 0; i < dots.length; i++) {
        const [x, y, , cap] = dots[i];
        const bx = Math.floor(x / binSize);
        const by = Math.floor(y / binSize);
        for (let nx = bx - 1; nx <= bx + 1; nx++) {
          for (let ny = by - 1; ny <= by + 1; ny++) {
            for (const j of bins.get(nx + "," + ny) ?? []) {
              const [px, py, , previousCap] = dots[j];
              const available = Math.hypot(x - px, y - py) - gap;
              if (available < cap + previousCap) neighbors.push([j, i, available]);
            }
          }
        }
        const key = bx + "," + by;
        if (!bins.has(key)) bins.set(key, []);
        bins.get(key).push(i);
      }
      const adjacent = dots.map(() => []);
      for (const [i, j, available] of neighbors) {
        adjacent[i].push([j, available]);
        adjacent[j].push([i, available]);
      }
      const shadowField = item.shadowField.map(([x, y, radius, cap, weight]) => {
        const bx = Math.floor(x / binSize);
        const by = Math.floor(y / binSize);
        const nearby = [];
        for (let nx = bx - 1; nx <= bx + 1; nx++) {
          for (let ny = by - 1; ny <= by + 1; ny++) {
            for (const i of bins.get(nx + "," + ny) ?? []) {
              const [px, py, , rippleCap] = dots[i];
              const available = Math.hypot(x - px, y - py) - gap;
              if (available < cap + rippleCap) nearby.push([i, available]);
            }
          }
        }
        const densityRank = orderedDensityRank(x, y);
        return {x, y, radius, cap, weight, densityRank, nearby};
      });
      const image = new Image();
      image.onload = schedule;
      image.src = item.image;
      return {
        side, dots, adjacent, shadowField, image, tone: values.map(value => (value - low) / span),
        cloudOffset: side === "back" ? 73 : 0,
        canvas: root.querySelector('[data-side="' + side + '"]'),
        detailY: 57
      };
    }

    let queued = false;
    let previews = [];
    function schedule() {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        render();
      });
    }

    function readSettings() {
      return Object.fromEntries(controls.map(input => [input.dataset.setting, Number(input.value)]));
    }

    function applyState(state) {
      if (state?.modelContent?.type !== "c6-halftone") return;
      for (const input of controls) {
        const key = input.dataset.setting;
        const legacySize = state.modelContent.size;
        const legacyDiameter = key === "maxDiameter" && Number.isFinite(legacySize)
          ? Math.round(65 * legacySize / 90) : undefined;
        const value = state.modelContent[key] ?? legacyDiameter;
        if (typeof value === "number" && Number.isFinite(value)) input.value = value;
      }
      if (["full", "detail"].includes(state.privateContent?.view)) view.value = state.privateContent.view;
    }

    function saveState() {
      if (!window.openai?.setWidgetState) return;
      window.openai.setWidgetState({
        modelContent: {type: "c6-halftone", ...readSettings(), back: backSettings},
        privateContent: {view: view.value}
      }).catch(() => {});
    }

    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }

    function orderedDensityRank(x, y) {
      const row = Math.round((y - .85) / .76);
      const col = Math.round((x - .78) / .78 - (row % 2) * .5);
      // The staggered dot lattice repeats this ordered 8 × 8 fill pattern.
      let rank = 0;
      for (let bit = 0; bit < 3; bit++) {
        rank = 4 * rank + 2 * (((col ^ row) >> bit) & 1) + ((row >> bit) & 1);
      }
      return (rank + .5) / 64;
    }

    function lattice(x, y) {
      let value = Math.imul(x + 17, 73856093) ^ Math.imul(y + 31, 19349663);
      value = Math.imul(value ^ (value >>> 16), 0x45d9f3b);
      value = Math.imul(value ^ (value >>> 16), 0x45d9f3b);
      return ((value ^ (value >>> 16)) >>> 0) / 0xffffffff;
    }

    function valueNoise(x, y) {
      const i = Math.floor(x);
      const j = Math.floor(y);
      const u = smoothstep(x - i);
      const v = smoothstep(y - j);
      const top = lattice(i, j) * (1 - u) + lattice(i + 1, j) * u;
      const bottom = lattice(i, j + 1) * (1 - u) + lattice(i + 1, j + 1) * u;
      return top * (1 - v) + bottom * v;
    }

    function cloudShadow(x, y, scale) {
      const u = x / scale;
      const v = y / scale;
      const cloud = .78 * valueNoise(u, v) + .22 * valueNoise(u * 2 + 8, v * 2 - 5);
      return smoothstep(Math.max(0, Math.min(1, (cloud - .34) / .40)));
    }

    function radiiFor(preview, settings) {
      const opacity = settings.cloudAmount / 100;
      const referenceSize = .85;
      const referenceShift = .0165;
      const contrastDelta = (settings.contrast ?? 50) / 50 - 1;
      const contrastPivot = .16;
      const adjustContrast = radius => radius + contrastDelta * (radius - contrastPivot);
      const maxRadius = settings.maxDiameter / 200;
      const crestHeadroom = Math.max(0, maxRadius - .325);
      const shadowAt = (x, y) => opacity ? opacity * cloudShadow(x, y + preview.cloudOffset, settings.cloudSize) : 0;
      const baseRadii = preview.dots.map((dot, i) => {
        const tone = preview.tone[i];
        const highlight = tone ** 2 * (settings.highlights / 100 - 1);
        const shadow = (1 - tone) ** 2 * (settings.shadows / 100 - 1);
        const cloud = shadowAt(dot[0], dot[1]);
        const shaded = dot[2] * referenceSize * (1 + highlight + shadow) * (1 - .72 * cloud) + referenceShift;
        return adjustContrast(shaded);
      });
      const crestStart = .18;
      const crestSpan = Math.max(.04, Math.max(...baseRadii) - crestStart);
      const requested = baseRadii.map(radius => {
        const crest = Math.max(0, (radius - crestStart) / crestSpan);
        return Math.min(maxRadius, radius + crestHeadroom * crest ** 2);
      });
      const order = requested.map((_, i) => i).sort((i, j) => requested[j] - requested[i]);
      const radii = new Array(requested.length).fill(0);
      // Give the strongest crests first use of the space between dot centers.
      for (const i of order) {
        let radius = Math.min(requested[i], preview.dots[i][3]);
        for (const [j, available] of preview.adjacent[i]) {
          if (radii[j]) radius = Math.min(radius, available - radii[j]);
        }
        if (radius >= minRadius) radii[i] = radius;
      }
      let limited = radii.reduce((count, radius, i) =>
        count + Number(requested[i] >= minRadius && radius < requested[i] - .001), 0);
      const density = settings.minDensity / 100;
      const shadowRadii = preview.shadowField.map(dot => {
        const floor = dot.densityRank < density ? .095 : 0;
        if (dot.weight === null && !floor) return 0;
        const weight = dot.weight ?? 0;
        const unshaded = dot.radius + .010 * weight
          + .175 * weight * (settings.shadows / 100) * referenceSize;
        const shaded = dot.weight === null ? 0
          : adjustContrast(unshaded * (1 - .86 * shadowAt(dot.x, dot.y)) + referenceShift);
        const wanted = Math.min(maxRadius, Math.max(shaded, floor));
        let radius = Math.min(wanted, dot.cap);
        for (const [i, available] of dot.nearby) {
          if (radii[i]) radius = Math.min(radius, available - radii[i]);
        }
        if (radius < minRadius - .0001) radius = 0;
        if (wanted >= minRadius && radius < wanted - .001) limited++;
        return radius;
      });
      return {radii, shadowRadii, limited};
    }

    function draw(preview, radii, shadowRadii) {
      const {canvas, image, dots} = preview;
      const w = Math.max(1, Math.round(canvas.clientWidth * (window.devicePixelRatio || 1)));
      const cropHeight = view.value === "detail" ? 34 : height;
      const y0 = view.value === "detail" ? preview.detailY : 0;
      const h = Math.round(w * cropHeight / width);
      if (canvas.width !== w) canvas.width = w;
      if (canvas.height !== h) canvas.height = h;
      const context = canvas.getContext("2d");
      context.setTransform(w / width, 0, 0, h / cropHeight, 0, -y0 * h / cropHeight);
      context.clearRect(0, y0, width, cropHeight);
      if (image.complete && image.naturalWidth > 0) context.drawImage(image, 0, 0, width, height);
      context.fillStyle = boardInk;
      context.beginPath();
      for (let i = 0; i < dots.length; i++) {
        const [x, y] = dots[i];
        const r = radii[i];
        if (!r || y + r < y0 || y - r > y0 + cropHeight) continue;
        context.moveTo(x + r, y);
        context.arc(x, y, r, 0, Math.PI * 2);
      }
      for (let i = 0; i < preview.shadowField.length; i++) {
        const {x, y} = preview.shadowField[i];
        const r = shadowRadii[i];
        if (!r || y + r < y0 || y - r > y0 + cropHeight) continue;
        context.moveTo(x + r, y);
        context.arc(x, y, r, 0, Math.PI * 2);
      }
      context.fill();
    }

    function render() {
      const settings = readSettings();
      boards.dataset.view = view.value;
      for (const input of controls) {
        input.parentElement.querySelector("output").value = input.dataset.setting === "maxDiameter"
          ? (Number(input.value) / 100).toFixed(2) + " mm"
          : input.value + (input.dataset.unit ?? "%");
      }
      let limited = 0;
      for (const preview of previews) {
        const isFront = preview.side === "front";
        const result = radiiFor(preview, isFront ? settings : backSettings);
        if (isFront) limited += result.limited;
        draw(preview, result.radii, result.shadowRadii);
      }
      const next = limited ? limited.toLocaleString() + " front dots limited by clearance" : "0.10 mm minimum dot gap";
      if (status.textContent !== next) status.textContent = next;
    }

    previews = Object.entries(data).map(([side, item]) => prepare(side, item));
    applyState(window.openai?.widgetState);
    for (const input of controls) {
      input.addEventListener("input", schedule);
      input.addEventListener("change", saveState);
    }
    view.addEventListener("change", () => { schedule(); saveState(); });
    window.addEventListener("openai:set_globals", event => {
      applyState(event.detail?.globals?.widgetState);
      schedule();
    });
    new ResizeObserver(schedule).observe(boards);
    render();
  })();
  </script>
