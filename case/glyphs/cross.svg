<?xml version="1.0" encoding="UTF-8"?>
<!-- Cross mark as two equal diagonal centerlines crossing at the centre. import_svg
     ignores stroke-width and legends.py thickens each centerline to
     LEGEND_STROKE_W, so stroke-width here is a preview weight only. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="#000000" stroke-width="20" stroke-linecap="round">
  <path d="M 0 0 L 100 100"/>
  <path d="M 100 0 L 0 100"/>
</svg>
